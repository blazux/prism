name: Build & Push Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: prism_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PRISM_TEST_SECRETS_URL: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
      PRISM_TEST_POSTGRES_URL: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
      PRISM_REVIEW_DB: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
      PRISM_TEAMS_TEST_DATABASE_URL: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Docker installation and workspace startup
        run: python3 -m unittest discover -s scripts/tests -v
      - run: go vet ./...
      - name: Prepare pgvector for isolated test schemas
        run: psql "$PRISM_TEST_SECRETS_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'
      - run: go test -race ./...
      - name: Check vulnerable Go calls
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - run: node --test web/tests/*.test.cjs
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/prism-browser" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/prism-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check critical browser paths
        timeout-minutes: 5
        run: |
          export NODE_PATH="$RUNNER_TEMP/prism-browser/node_modules"
          for test in \
            web/tests/response-attachments-browser.cjs \
            web/tests/teams-admin-browser.cjs \
            web/tests/admin-values-browser.cjs \
            web/tests/widget-origin-browser.cjs \
            web/tests/widget-ready-browser.cjs \
            web/tests/widget-backend-browser.cjs \
            web/tests/preferences-browser.cjs \
            web/tests/email-selection-browser.cjs \
            web/tests/email-forward-browser.cjs \
            web/tests/email-refresh-browser.cjs \
            web/tests/frame-theme-browser.cjs \
            web/tests/settings-chat-browser.cjs \
            web/tests/telephony-app-browser.cjs \
            web/tests/conversation-settings-browser.cjs \
            web/tests/theme-gallery-browser.cjs \
            web/tests/theme-controls-browser.cjs \
            web/tests/theme-effects-browser.cjs \
            web/tests/markdown-rendering-browser.cjs \
            web/tests/file-editor-browser.cjs \
            web/tests/documents-browser.cjs \
            web/tests/interrupted-work-browser.cjs \
            web/tests/object-links-browser.cjs \
            web/tests/data-events-browser.cjs; do
            echo "::group::$test"
            if node "$test" > "$RUNNER_TEMP/prism-browser-test.log" 2>&1; then
              cat "$RUNNER_TEMP/prism-browser-test.log"
              echo '::endgroup::'
            else
              cat "$RUNNER_TEMP/prism-browser-test.log"
              echo '::endgroup::'
              node -e 'const fs=require("node:fs"); const message=fs.readFileSync(process.argv[1],"utf8").slice(-6000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"); console.log("::error title=Browser regression,file="+process.argv[2]+"::"+message)' "$RUNNER_TEMP/prism-browser-test.log" "$test"
              exit 1
            fi
          done
  build:
    needs: verify
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push server image
        id: server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prism
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max

      - name: Build & push workspace image
        id: workspace
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/prism-workspace
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=workspace-${{ matrix.arch }}
          cache-to: type=gha,scope=workspace-${{ matrix.arch }},mode=max

      - name: Export image digests
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          WORKSPACE_DIGEST: ${{ steps.workspace.outputs.digest }}
        run: |
          [[ "$SERVER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WORKSPACE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests/prism" "$RUNNER_TEMP/digests/prism-workspace"
          touch "$RUNNER_TEMP/digests/prism/${SERVER_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/prism-workspace/${WORKSPACE_DIGEST#sha256:}"

      - name: Upload image digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish multi-platform images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DIGESTS_DIR: ${{ runner.temp }}/digests
        run: |
          shopt -s nullglob
          for repository in prism prism-workspace; do
            digests=("$DIGESTS_DIR/$repository/"*)
            [[ ${#digests[@]} == 2 ]]
            for digest in "${digests[@]}"; do
              [[ -f "$digest" && "${digest##*/}" =~ ^[0-9a-f]{64}$ ]]
            done
          done
          for repository in prism prism-workspace; do
            image="$DOCKERHUB_USERNAME/$repository"
            tags=$(bash scripts/docker-image-tags.sh "$image" "$GITHUB_REF")
            IFS=, read -r -a image_tags <<< "$tags"
            args=()
            for tag in "${image_tags[@]}"; do args+=(--tag "$tag"); done
            for digest in "$DIGESTS_DIR/$repository/"*; do args+=("$image@sha256:${digest##*/}"); done
            docker buildx imagetools create "${args[@]}"
            docker buildx imagetools inspect "${image_tags[0]}"
          done

  release:
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          sed '1{/^# /d;}' "$notes" > "$RUNNER_TEMP/prism-release.md"
          if is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = true ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --title "Prism ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/prism-release.md" --latest
            else
              echo "Release $RELEASE_TAG already exists."
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Prism ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/prism-release.md" --latest
          fi
