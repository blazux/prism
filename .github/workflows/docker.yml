name: Build & Push Docker images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: prism_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PRISM_TEST_SECRETS_URL: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
      PRISM_TEST_POSTGRES_URL: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
      PRISM_REVIEW_DB: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
      PRISM_TEAMS_TEST_DATABASE_URL: postgres://postgres:fixture@localhost:5432/prism_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go vet ./...
      - name: Prepare pgvector for isolated test schemas
        run: psql "$PRISM_TEST_SECRETS_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'
      - run: go test -race ./...
      - name: Check vulnerable Go calls
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - run: node --test web/tests/*.test.cjs
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/prism-browser" --no-save --ignore-scripts --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/prism-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check critical browser paths
        timeout-minutes: 5
        run: |
          export NODE_PATH="$RUNNER_TEMP/prism-browser/node_modules"
          for test in web/tests/response-attachments-browser.cjs web/tests/teams-admin-browser.cjs web/tests/telephony-app-browser.cjs web/tests/conversation-settings-browser.cjs; do
            echo "::group::$test"
            if node "$test" > "$RUNNER_TEMP/prism-browser-test.log" 2>&1; then
              cat "$RUNNER_TEMP/prism-browser-test.log"
              echo '::endgroup::'
            else
              cat "$RUNNER_TEMP/prism-browser-test.log"
              echo '::endgroup::'
              node -e 'const fs=require("node:fs"); const message=fs.readFileSync(process.argv[1],"utf8").slice(-6000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"); console.log("::error title=Browser regression,file="+process.argv[2]+"::"+message)' "$RUNNER_TEMP/prism-browser-test.log" "$test"
              exit 1
            fi
          done
  build:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags for server image
        id: tags-server
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prism
        run: |
          tags=$(bash scripts/docker-image-tags.sh "$DOCKER_IMAGE" "$GITHUB_REF")
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Compute tags for workspace image
        id: tags-workspace
        env:
          DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/prism-workspace
        run: |
          tags=$(bash scripts/docker-image-tags.sh "$DOCKER_IMAGE" "$GITHUB_REF")
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags-server.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push workspace image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags-workspace.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          sed '1{/^# /d;}' "$notes" > "$RUNNER_TEMP/prism-release.md"
          if is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" = true ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --title "Prism ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/prism-release.md" --latest
            else
              echo "Release $RELEASE_TAG already exists."
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Prism ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/prism-release.md" --latest
          fi
