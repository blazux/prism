name: Build & Push Docker images

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags for server image
        id: tags-server
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/prism:${{ github.ref_name }},${{ secrets.DOCKERHUB_USERNAME }}/prism:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/prism:unstable" >> $GITHUB_OUTPUT
          fi

      - name: Compute tags for workspace image
        id: tags-workspace
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/prism-workspace:${{ github.ref_name }},${{ secrets.DOCKERHUB_USERNAME }}/prism-workspace:latest" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ secrets.DOCKERHUB_USERNAME }}/prism-workspace:unstable" >> $GITHUB_OUTPUT
          fi

      - name: Build & push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags-server.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push workspace image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags-workspace.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
