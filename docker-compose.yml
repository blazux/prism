name: prism

services:
  prism-server:
    image: blazux/prism:latest
    ports:
      - "48080:8080"
    volumes:
      - workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBED_MODEL=${EMBED_MODEL}
      - POSTGRES_URL=${POSTGRES_URL}
      - SEARXNG_URL=${SEARXNG_URL}
      - AGENT_CONTAINER=${AGENT_CONTAINER}
      - WORKSPACE_DIR=${WORKSPACE_DIR}
      - PLUGIN_DIR=${PLUGIN_DIR}
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host-gateway:host-gateway"
    container_name: prism-server
    depends_on:
      - searxng
      - postgres
    restart: unless-stopped

  # Agent workspace container — the AI executes code here
  workspace:
    image: blazux/prism-workspace:latest
    container_name: prism-workspace
    volumes:
      - workspace:/workspace
    environment:
      - TZ=${TZ:-UTC}
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PAGER=cat
      - COLORTERM=truecolor
    command: >
      sh -c "
        [ -f /workspace/.apt-packages ] && apt-get update -qq && xargs apt-get install -y < /workspace/.apt-packages;
        [ -f /workspace/.pip-packages ] && pip3 install -q $(cat /workspace/.pip-packages);
        [ -f /workspace/.crontab ] && crontab /workspace/.crontab;
        cron && tail -f /dev/null
      "
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism-postgres
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Self-hosted search engine for web_search tool
  searxng:
    image: searxng/searxng:latest
    container_name: prism-searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    restart: unless-stopped

volumes:
  workspace:
  pgdata:
