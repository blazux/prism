name: prism

services:
  prism-server:
    image: blazux/prism:latest
    ports:
      - "48080:8080"
    volumes:
      - workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # To connect a Markdown vault (Obsidian/Logseq) to the Notes app, mount it
      # here and set its path in Settings → Notes (e.g. /vault):
      # - /path/to/your/ObsidianVault:/vault
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBED_MODEL=${EMBED_MODEL}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBED_BACKEND=${EMBED_BACKEND:-}
      - VISION_MODEL=${VISION_MODEL:-}
      - POSTGRES_URL=${POSTGRES_URL}
      - SEARXNG_URL=${SEARXNG_URL}
      - PRISM_TOKEN=${PRISM_TOKEN:-}
      - AGENT_CONTAINER=${AGENT_CONTAINER}
      - WORKSPACE_DIR=${WORKSPACE_DIR}
      - PLUGIN_DIR=${PLUGIN_DIR}
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host-gateway:host-gateway"
    container_name: prism-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prism.rule=Host(`prism.localhost`)"
      - "traefik.http.services.prism.loadbalancer.server.port=8080"
    depends_on:
      - searxng
      - postgres
    restart: unless-stopped

  # Traefik reverse proxy — routes *.localhost subdomains to service containers
  traefik:
    image: traefik:v3.2
    container_name: prism-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=prism_default"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      # Shared middleware: strip X-Frame-Options and CSP frame-ancestors so any
      # service container can be embedded as an iframe from prism.localhost.
      - "traefik.http.middlewares.strip-frames.headers.customResponseHeaders.X-Frame-Options="
      - "traefik.http.middlewares.strip-frames.headers.customResponseHeaders.Content-Security-Policy="
    restart: unless-stopped

  # Agent workspace container — the AI executes code here
  workspace:
    image: blazux/prism-workspace:latest
    container_name: prism-workspace
    volumes:
      - workspace:/workspace
    environment:
      - TZ=${TZ:-UTC}
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PAGER=cat
      - COLORTERM=truecolor
    command: >
      sh -c "
        [ -f /workspace/.apt-packages ] && apt-get update -qq && xargs apt-get install -y < /workspace/.apt-packages;
        [ -f /workspace/.pip-packages ] && pip3 install -q $(cat /workspace/.pip-packages);
        [ -f /workspace/.crontab ] && crontab /workspace/.crontab;
        cron && tail -f /dev/null
      "
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism-postgres
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Self-hosted search engine for web_search tool
  searxng:
    image: searxng/searxng:latest
    container_name: prism-searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    restart: unless-stopped

  # ProtonMail Bridge — speaks IMAP/SMTP for Proton accounts. The image re-exposes
  # the bridge on standard ports inside the Docker network: IMAP 143, SMTP 25.
  # Built from a small Dockerfile that adds libfido2 (upstream auto-update needs it).
  # One-time login:  docker compose run --rm protonmail-bridge init
  #   in the bridge shell:  login  → Proton email + password + 2FA,
  #                         info   → copy the username + bridge password,  exit.
  # In Prism Email → ProtonMail → Advanced: host (IMAP & SMTP) = "protonmail-bridge",
  # IMAP port 143, SMTP port 25, STARTTLS + self-signed.
  protonmail-bridge:
    build:
      context: .
      dockerfile: Dockerfile.protonmail-bridge
    container_name: prism-protonmail-bridge
    volumes:
      - protonmail:/root
    restart: unless-stopped

volumes:
  workspace:
  pgdata:
  protonmail:
