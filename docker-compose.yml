name: prism

services:
  prism-server:
    image: blazux/prism:latest
    # Published images: compose pull, then up -d --no-build.
    # Build this checkout: compose up -d --build. See the README.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "48080:8080"
      - "${WIDGET_PORT:-48082}:8081"
    volumes:
      - workspace:/workspace
      - server-private:/var/lib/prism
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional host vault: set NOTES_VAULT_PATH in .env, then select /vault
      # in Settings → Notes. Unset = a managed volume, no host folder exposed.
      - ${NOTES_VAULT_PATH:-notes-vault}:/vault
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBED_MODEL=${EMBED_MODEL}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_REASONING_EFFORT=${OPENAI_REASONING_EFFORT-medium}
      - PRISM_OPENAI_LAZY_TOOLS=${PRISM_OPENAI_LAZY_TOOLS:-}
      - PRISM_OPENAI_CACHE_RETENTION=${PRISM_OPENAI_CACHE_RETENTION:-}
      - PRISM_COMPACT_COMMAND_OUTPUT=${PRISM_COMPACT_COMMAND_OUTPUT:-}
      # Claude, with LLM_BACKEND=anthropic. Needs a console API key — a Pro/Max
      # subscription token does not work (see the README).
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - PRISM_ANTHROPIC_CACHE_TTL=${PRISM_ANTHROPIC_CACHE_TTL:-5m}
      # Experimental tool discovery; off by default.
      - PRISM_ANTHROPIC_TOOL_SEARCH=${PRISM_ANTHROPIC_TOOL_SEARCH:-}
      - PRISM_CLAUDE_LAZY_TOOLS=${PRISM_CLAUDE_LAZY_TOOLS:-}
      - EMBED_BACKEND=${EMBED_BACKEND:-}
      - VISION_MODEL=${VISION_MODEL:-}
      - CHAT_VISION=${CHAT_VISION:-}
      # Off by default: a personal Prism has one user and PRISM_TOKEN is its whole
      # authentication. Set to 1 for a shared deployment (accounts, groups, rooms).
      # Not a toggle — turning it on migrates this deployment's config keys to the
      # first admin's scope, and single-user would no longer find them.
      - MULTI_USER=${MULTI_USER:-}
      # Set VOX_URL to a Prism Vox instance and the agent gains the phone: it can
      # place, list and cancel calls. Empty = no telephony.
      - VOX_URL=${VOX_URL:-}
      - VOX_USER=${VOX_USER:-}
      - VOX_PASSWORD=${VOX_PASSWORD:-}
      - POSTGRES_URL=${POSTGRES_URL}
      - LIVE_CONTEXT_CHAR_BUDGET=${LIVE_CONTEXT_CHAR_BUDGET:-}
      - SEARXNG_URL=${SEARXNG_URL}
      - PRISM_TOKEN=${PRISM_TOKEN:-}
      - WIDGET_ORIGIN=${WIDGET_ORIGIN:-}
      - WIDGET_PORT=${WIDGET_PORT:-48082}
      - DOCKER_MODE=${DOCKER_MODE:-host}
      - SERVICE_PORT_START=${SERVICE_PORT_START:-20000}
      - SERVICE_PORT_END=${SERVICE_PORT_END:-20999}
      - WORKSPACE_DOCKER_SOCKET=${WORKSPACE_DOCKER_SOCKET:-unix:///run/user/1000/docker.sock}
      - WORKSPACE_DOCKER_USER=${WORKSPACE_DOCKER_USER:-1000}
      - AGENT_CONTAINER=${AGENT_CONTAINER}
      - WORKSPACE_DIR=${WORKSPACE_DIR}
      - PLUGIN_DIR=${PLUGIN_DIR}
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host-gateway:host-gateway"
    container_name: prism-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prism.rule=Host(`prism.localhost`)"
      - "traefik.http.services.prism.loadbalancer.server.port=8080"
    depends_on:
      - searxng
      - postgres
    restart: unless-stopped

  # Traefik reverse proxy — routes *.localhost subdomains to service containers
  traefik:
    # Docker 29 requires API negotiation supported by current Traefik.
    image: traefik:v3.6.25
    container_name: prism-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=prism_default"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      # Shared middleware: strip X-Frame-Options and CSP frame-ancestors so any
      # service container can be embedded as an iframe from prism.localhost.
      - "traefik.http.middlewares.strip-frames.headers.customResponseHeaders.X-Frame-Options="
      - "traefik.http.middlewares.strip-frames.headers.customResponseHeaders.Content-Security-Policy="
    restart: unless-stopped

  # Agent workspace container — the AI executes code here
  workspace:
    image: blazux/prism-workspace:${WORKSPACE:-latest}
    # Dockerfile.agent builds the execution workspace, not the chat model.
    # Leave WORKSPACE unset for the published CPU image. WORKSPACE=gpu builds
    # Dockerfile.agent.gpu under a separate :gpu tag. Other values are unsupported.
    # GPU access and local-build policy belong in docker-compose.override.yml;
    # see the README's optional NVIDIA workspace setup.
    build:
      context: .
      dockerfile: Dockerfile.agent${WORKSPACE:+.${WORKSPACE}}
    container_name: prism-workspace
    volumes:
      - workspace:/workspace
    environment:
      - TZ=${TZ:-UTC}
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PAGER=cat
      - COLORTERM=truecolor
      # On a network with an outbound proxy (e.g. Squid), it must not swallow
      # traffic to prism-server or docker_run/docker_compose services — those
      # are internal Docker-network calls (the agent's own $PRISM_URL,
      # /api/builtin, /api/tool, MCP tool calls), not egress. Without this, an
      # HTTP call the agent makes to its own backend gets silently routed
      # through the proxy and fails (observed as a bare 503, with nothing in
      # Prism's own logs — the request never reached prism-server at all).
      # Prepends onto whatever HTTP(S)_PROXY/NO_PROXY the host/daemon already
      # injects, rather than replacing it.
      - NO_PROXY=prism-server,prism-svc-*,localhost,127.0.0.1,${NO_PROXY:-}
      - no_proxy=prism-server,prism-svc-*,localhost,127.0.0.1,${no_proxy:-}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism-postgres
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Self-hosted search engine for web_search tool
  searxng:
    image: searxng/searxng:latest
    container_name: prism-searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    restart: unless-stopped

  # ProtonMail Bridge — speaks IMAP/SMTP for Proton accounts. The image re-exposes
  # the bridge on standard ports inside the Docker network: IMAP 143, SMTP 25.
  # Built from a small Dockerfile that adds libfido2 (upstream auto-update needs it).
  # One-time login (see docs/help/protonmail-bridge.md):
  #   docker compose stop protonmail-bridge          ← it holds the /root volume
  #   docker compose run --rm protonmail-bridge init ← inits gpg+pass, opens the shell
  #     in the bridge shell:  login  → Proton email + password + 2FA,
  #                           info   → copy the username + bridge password,  exit.
  #   docker compose up -d protonmail-bridge
  # The bridge password is generated here — it is NOT your Proton password, and it
  # exists nowhere until `login` succeeds. Paid Proton plan required.
  # In Prism Email → ProtonMail → Advanced: host (IMAP & SMTP) = "protonmail-bridge",
  # IMAP port 143, SMTP port 25, STARTTLS + self-signed.
  protonmail-bridge:
    # Optional: upstream currently supplies no ARM64 image.
    profiles: [protonmail]
    build:
      context: .
      dockerfile: Dockerfile.protonmail-bridge
    container_name: prism-protonmail-bridge
    volumes:
      - protonmail:/root
    restart: unless-stopped

volumes:
  notes-vault:
  server-private:
  workspace:
  pgdata:
  protonmail:
