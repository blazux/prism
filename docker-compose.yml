name: prism

services:
  prism-server:
    image: blazux/prism:latest
    # Without this, `docker compose build` has nothing to do for this service —
    # `up`/`pull` silently keep whatever blazux/prism:latest was last pulled,
    # so a `git pull` here never actually reaches the running container. Lived
    # this: hours of "the fix isn't taking" chasing a stale image, not a bug.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "48080:8080"
    volumes:
      - workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # To connect a Markdown vault (Obsidian/Logseq) to the Notes app, mount it
      # here and set its path in Settings → Notes (e.g. /vault):
      # - /path/to/your/ObsidianVault:/vault
      # LLM_BACKEND=anthropic without an API key runs on your Claude subscription:
      # log in on the host with `claude`, then mount the token it stores. Prism
      # refreshes that token, so the mount must be writable — no :ro. Add it in a
      # local docker-compose.override.yml, since the host path is yours alone:
      # - ~/.claude/.credentials.json:/root/.claude/.credentials.json
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - EMBED_MODEL=${EMBED_MODEL}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Claude. Leave ANTHROPIC_API_KEY empty to run on a Claude subscription
      # instead of per-token billing — see the credentials mount above.
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_CREDENTIALS_FILE=${ANTHROPIC_CREDENTIALS_FILE:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_CLI_VERSION=${ANTHROPIC_CLI_VERSION:-}
      - EMBED_BACKEND=${EMBED_BACKEND:-}
      - VISION_MODEL=${VISION_MODEL:-}
      - CHAT_VISION=${CHAT_VISION:-}
      # Off by default: a personal Prism has one user and PRISM_TOKEN is its whole
      # authentication. Set to 1 for a shared deployment (accounts, groups, rooms).
      # Not a toggle — turning it on migrates this deployment's config keys to the
      # first admin's scope, and single-user would no longer find them.
      - MULTI_USER=${MULTI_USER:-}
      # Set VOX_URL to a PrismConnect instance and the agent gains the phone: it can
      # place, list and cancel calls. Empty = no telephony.
      - VOX_URL=${VOX_URL:-}
      - VOX_USER=${VOX_USER:-}
      - VOX_PASSWORD=${VOX_PASSWORD:-}
      - POSTGRES_URL=${POSTGRES_URL}
      - SEARXNG_URL=${SEARXNG_URL}
      - PRISM_TOKEN=${PRISM_TOKEN:-}
      - AGENT_CONTAINER=${AGENT_CONTAINER}
      - WORKSPACE_DIR=${WORKSPACE_DIR}
      - PLUGIN_DIR=${PLUGIN_DIR}
      - TZ=${TZ:-UTC}
    extra_hosts:
      - "host-gateway:host-gateway"
    container_name: prism-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prism.rule=Host(`prism.localhost`)"
      - "traefik.http.services.prism.loadbalancer.server.port=8080"
    depends_on:
      - searxng
      - postgres
    restart: unless-stopped

  # Traefik reverse proxy — routes *.localhost subdomains to service containers
  traefik:
    image: traefik:v3.2
    container_name: prism-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=prism_default"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      # Shared middleware: strip X-Frame-Options and CSP frame-ancestors so any
      # service container can be embedded as an iframe from prism.localhost.
      - "traefik.http.middlewares.strip-frames.headers.customResponseHeaders.X-Frame-Options="
      - "traefik.http.middlewares.strip-frames.headers.customResponseHeaders.Content-Security-Policy="
    restart: unless-stopped

  # Agent workspace container — the AI executes code here
  workspace:
    image: blazux/prism-workspace:latest
    # See the prism-server build: comment — same reason. Uses Dockerfile.agent,
    # or Dockerfile.agent.gpu when WORKSPACE=gpu is set.
    # A GPU host also needs its own `deploy.resources.reservations.devices`
    # (nvidia) block — add it via a local, untracked docker-compose.override.yml
    # rather than here, since most deployments have no GPU on this box at all.
    build:
      context: .
      dockerfile: Dockerfile.agent${WORKSPACE:+.gpu}
    container_name: prism-workspace
    volumes:
      - workspace:/workspace
    environment:
      - TZ=${TZ:-UTC}
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
      - PAGER=cat
      - COLORTERM=truecolor
      # On a network with an outbound proxy (e.g. Squid), it must not swallow
      # traffic to prism-server or docker_run/docker_compose services — those
      # are internal Docker-network calls (the agent's own $PRISM_URL,
      # /api/builtin, /api/tool, MCP tool calls), not egress. Without this, an
      # HTTP call the agent makes to its own backend gets silently routed
      # through the proxy and fails (observed as a bare 503, with nothing in
      # Prism's own logs — the request never reached prism-server at all).
      # Prepends onto whatever HTTP(S)_PROXY/NO_PROXY the host/daemon already
      # injects, rather than replacing it.
      - NO_PROXY=prism-server,prism-svc-*,localhost,127.0.0.1,${NO_PROXY:-}
      - no_proxy=prism-server,prism-svc-*,localhost,127.0.0.1,${no_proxy:-}
    command: >
      sh -c "
        [ -f /workspace/.apt-packages ] && apt-get update -qq && xargs apt-get install -y < /workspace/.apt-packages;
        [ -f /workspace/.pip-packages ] && pip3 install -q $(cat /workspace/.pip-packages);
        [ -f /workspace/.crontab ] && crontab /workspace/.crontab;
        cron && tail -f /dev/null
      "
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism-postgres
    environment:
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag
      - POSTGRES_DB=rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # Self-hosted search engine for web_search tool
  searxng:
    image: searxng/searxng:latest
    container_name: prism-searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
    restart: unless-stopped

  # ProtonMail Bridge — speaks IMAP/SMTP for Proton accounts. The image re-exposes
  # the bridge on standard ports inside the Docker network: IMAP 143, SMTP 25.
  # Built from a small Dockerfile that adds libfido2 (upstream auto-update needs it).
  # One-time login (see docs/help/protonmail-bridge.md):
  #   docker compose stop protonmail-bridge          ← it holds the /root volume
  #   docker compose run --rm protonmail-bridge init ← inits gpg+pass, opens the shell
  #     in the bridge shell:  login  → Proton email + password + 2FA,
  #                           info   → copy the username + bridge password,  exit.
  #   docker compose up -d protonmail-bridge
  # The bridge password is generated here — it is NOT your Proton password, and it
  # exists nowhere until `login` succeeds. Paid Proton plan required.
  # In Prism Email → ProtonMail → Advanced: host (IMAP & SMTP) = "protonmail-bridge",
  # IMAP port 143, SMTP port 25, STARTTLS + self-signed.
  protonmail-bridge:
    build:
      context: .
      dockerfile: Dockerfile.protonmail-bridge
    container_name: prism-protonmail-bridge
    volumes:
      - protonmail:/root
    restart: unless-stopped

volumes:
  workspace:
  pgdata:
  protonmail:
