<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="stylesheet" href="/widget-base.css">
<script src="/theme.js"></script>
<script src="/apiclient.js"></script>
<script src="/modal.js"></script>
<script src="/editor-bridge.js"></script>
<script src="/pim-editor.js"></script>
<script>
  addEventListener('message', e => {
    if (e.data && e.data.type === 'prism-theme' && e.data.vars) {
      const r = document.documentElement.style;
      for (const k in e.data.vars) r.setProperty(k, e.data.vars[k]);
    }
  });
</script>
<style>
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .head h1 { font-size: 16px; color: var(--text); min-width: 150px; }
  .head .spacer { flex: 1; }
  .nav-btn { width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .seg { display: flex; border: 1px solid var(--border2); border-radius: 7px; overflow: hidden; }
  .seg button { background: var(--bg2); border: none; color: var(--text2); font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; }
  .seg button:hover { color: var(--text); }
  .seg button.active { background: var(--bg3); color: var(--accent); }

  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Month ── */
  .month { flex: 1; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); }
  .weekdays div { padding: 6px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); text-align: right; }
  .weeks { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; min-height: 0; }
  .cell { border-top: 1px solid var(--border); border-left: 1px solid var(--border); padding: 4px 6px; overflow: hidden; display: flex; flex-direction: column; gap: 3px; cursor: pointer; transition: background .12s; min-height: 0; }
  .cell:nth-child(7n) { border-right: 1px solid var(--border); }
  .cell:hover { background: var(--bg2); }
  .cell.dim { opacity: .4; }
  .cell .dnum { font-size: 12px; color: var(--text2); text-align: right; flex-shrink: 0; }
  .cell.today .dnum { color: #fff; background: var(--accent); border-radius: 50%; width: 22px; height: 22px; line-height: 22px; text-align: center; margin-left: auto; font-weight: 600; }
  .ev { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--accent-dim); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .ev-more { font-size: 10px; color: var(--text3); padding: 1px 6px; cursor: default; }
  .ev .t { color: var(--text2); }

  /* ── Time grid (week / day) ── */
  .tg { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .tg-head { display: flex; border-bottom: 1px solid var(--border); }
  .tg-corner { width: 52px; flex-shrink: 0; }
  .tg-headcols { flex: 1; display: grid; }
  .tg-dh { text-align: center; padding: 6px 2px; font-size: 11px; color: var(--text2); cursor: pointer; border-left: 1px solid var(--border); text-transform: uppercase; letter-spacing: .03em; }
  .tg-dh:hover { background: var(--bg2); }
  .tg-dh .dnum2 { display: block; font-size: 16px; color: var(--text); margin-top: 2px; text-transform: none; }
  .tg-dh.today .dnum2 { color: var(--accent); font-weight: 700; }
  .tg-allday { display: flex; border-bottom: 1px solid var(--border); min-height: 26px; max-height: 84px; overflow-y: auto; }
  .tg-allday .lab { width: 52px; flex-shrink: 0; font-size: 10px; color: var(--text3); padding: 4px 6px 0 0; text-align: right; }
  .tg-adcols { flex: 1; display: grid; }
  .tg-adcell { border-left: 1px solid var(--border); padding: 2px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; }
  .ad-ev { font-size: 11px; padding: 2px 6px; border-radius: 5px; background: var(--accent-dim); color: var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tg-scroll { flex: 1; overflow-y: auto; display: flex; }
  .tg-gutter { width: 52px; flex-shrink: 0; }
  .tg-hour { font-size: 10px; color: var(--text3); text-align: right; padding-right: 6px; box-sizing: border-box; }
  .tg-hour span { position: relative; top: -6px; }
  .tg-cols { flex: 1; display: grid; }
  .tg-col { position: relative; border-left: 1px solid var(--border); cursor: pointer; }
  .tg-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); pointer-events: none; }
  .tg-ev { position: absolute; background: var(--accent-dim); border-left: 3px solid var(--accent); border-radius: 4px; padding: 1px 5px; font-size: 11px; line-height: 1.3; color: var(--text); overflow: hidden; cursor: pointer; box-sizing: border-box; }
  .tg-ev .et { color: var(--accent); font-size: 10px; }

  /* ── Agenda ── */
  .agenda { flex: 1; overflow-y: auto; }
  .ag-day { padding: 10px 18px 5px; font-size: 12px; color: var(--text2); font-weight: 600; position: sticky; top: 0; background: var(--bg1); border-bottom: 1px solid var(--border); }
  .ag-day.today { color: var(--accent); }
  .ag-row { display: flex; gap: 12px; padding: 9px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .ag-row:hover { background: var(--bg2); }
  .ag-time { width: 116px; flex-shrink: 0; font-size: 12px; color: var(--text2); }
  .ag-main { flex: 1; min-width: 0; }
  .ag-title { color: var(--text); font-size: 13px; }
  .ag-loc { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .ag-empty { padding: 44px; text-align: center; color: var(--text3); }

  /* event modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .form { width: min(420px, 92vw); background: var(--bg1); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .form-title { font-weight: 600; color: var(--text); }
  .form label { font-size: 11px; color: var(--text2); display: flex; flex-direction: column; gap: 4px; }
  .form label.row { flex-direction: row; align-items: center; gap: 7px; font-size: 12px; color: var(--text); cursor: pointer; }
  .form label.row input { width: auto; }
  .form input, .form textarea { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; box-sizing: border-box; }
  .form textarea { resize: vertical; min-height: 52px; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-foot { display: flex; gap: 8px; align-items: center; margin-top: 4px; }
  .form-foot .grow { flex: 1; }
  .btn-del { background: none; border: 1px solid var(--border2); color: var(--red); }
  .btn-del:hover { background: var(--bg3); }
  .err { color: var(--red); font-size: 12px; min-height: 14px; }
</style>
</head>
<body>
  <div class="app">
    <div class="head">
      <h1 id="title"></h1>
      <span id="src-badge" style="display:none;font-size:11px;color:var(--text3);border:1px solid var(--border);border-radius:999px;padding:2px 9px;white-space:nowrap"></span>
      <button class="btn nav-btn" onclick="move(-1)" title="Previous">‹</button>
      <button class="btn" onclick="today()">Today</button>
      <button class="btn nav-btn" onclick="move(1)" title="Next">›</button>
      <div class="seg" id="seg">
        <button data-m="month" onclick="setMode('month')">Month</button>
        <button data-m="week" onclick="setMode('week')">Week</button>
        <button data-m="day" onclick="setMode('day')">Day</button>
        <button data-m="agenda" onclick="setMode('agenda')">Agenda</button>
      </div>
      <span class="spacer"></span>
      <button class="btn btn-accent" onclick="addToday()">＋ Event</button>
    </div>
    <div class="body" id="cal"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="form">
      <div class="form-title" id="form-title">New event</div>
      <label>Title<input id="f-title" placeholder="Event title"></label>
      <label>Start date<input id="f-date" type="date"></label>
      <label>End date<input id="f-enddate" type="date"></label>
      <label class="row"><input type="checkbox" id="f-allday"> All day</label>
      <div class="times" id="f-times">
        <label>Start<input id="f-start" type="time"></label>
        <label>End<input id="f-end" type="time"></label>
      </div>
      <label>Location<input id="f-loc" placeholder="Optional"></label>
      <label>Description<textarea id="f-desc" placeholder="Optional"></textarea></label>
      <div class="err" id="f-err"></div>
      <div class="form-foot">
        <button class="btn btn-del" id="f-del" onclick="deleteEvent()">Delete</button>
        <span class="grow"></span>
        <button class="btn" onclick="closeForm()">Cancel</button>
        <button class="btn btn-accent" onclick="saveForm()">Save</button>
      </div>
    </div>
  </div>

<script>
const session = new URLSearchParams(location.search).get('session') || 'default';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WD = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const HOUR_H = 44;       // px per hour in the time grid
const AGENDA_DAYS = 30;
const MODE_KEY = 'prism-cal-mode';

let mode = localStorage.getItem(MODE_KEY) || 'month';
let view = new Date();
let events = [];

function $(id) { return document.getElementById(id); }
function pad(x) { return String(x).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function el(tag, cls) { const x = document.createElement(tag); if (cls) x.className = cls; return x; }
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function weekStart(d) { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function shortDate(d) { return MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function isAllDay(ev) { return ev.allDay===true; }
function eventStart(ev){return new Date(isAllDay(ev)?ev.startAt.slice(0,10)+'T00:00:00':ev.startAt);}
function eventEnd(ev){return ev.endAt?new Date(isAllDay(ev)?ev.endAt.slice(0,10)+'T00:00:00':ev.endAt):new Date(eventStart(ev).getTime()+30*60000);}
function occursOn(ev,d){const next=startOfDay(d);next.setDate(next.getDate()+1);return eventStart(ev)<next && eventEnd(ev)>startOfDay(d);}
function minutesOf(d) { return d.getHours() * 60 + d.getMinutes(); }

function setMode(m) {
  mode = m; localStorage.setItem(MODE_KEY, m);
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('active', b.dataset.m === m));
  load();
}
function move(n) {
  if (mode === 'month') {view.setDate(1);view.setMonth(view.getMonth() + n);}
  else if (mode === 'week') view.setDate(view.getDate() + 7 * n);
  else if (mode === 'day') view.setDate(view.getDate() + n);
  else view.setDate(view.getDate() + AGENDA_DAYS * n);
  load();
}
function today() { view = new Date(); load(); }

function setSourceBadge(src) {
  const el = document.getElementById('src-badge'); if (!el) return;
  const L = { google: 'Google', microsoft: 'Microsoft', caldav: 'CalDAV', todoist: 'Todoist', vault: 'Vault' };
  if (src && L[src]) { el.textContent = '◦ ' + L[src]; el.style.display = 'inline-block'; } else { el.style.display = 'none'; }
}
let loadGeneration=0;
async function load() {
  const generation=++loadGeneration;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('active', b.dataset.m === mode));
  let from, to, title;
  const y = view.getFullYear(), m = view.getMonth();
  if (mode === 'month') {
    const first = new Date(y, m, 1);
    from = new Date(y, m, 1 - ((first.getDay() + 6) % 7));
    to = new Date(from); to.setDate(from.getDate() + 41);
    title = `${MONTHS[m]} ${y}`;
  } else if (mode === 'week') {
    from = weekStart(view); to = new Date(from); to.setDate(from.getDate() + 6);
    title = `${shortDate(from)} – ${shortDate(to)}, ${to.getFullYear()}`;
  } else if (mode === 'day') {
    from = startOfDay(view); to = new Date(from);
    title = view.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  } else {
    from = startOfDay(view); to = new Date(from); to.setDate(from.getDate() + AGENDA_DAYS);
    title = 'Agenda';
  }
  $('title').textContent = title;
    publishCalendarContext();
  try {
    const endRange=new Date(to);endRange.setHours(23,59,59,999);
    const data = await PrismAPI.api(`/api/events?session=${encodeURIComponent(session)}&from=${encodeURIComponent(from.toISOString())}&to=${encodeURIComponent(endRange.toISOString())}`);
    if(generation!==loadGeneration)return;
    events = data.events || [];
    setSourceBadge(data.source);
  } catch(e) {if(generation!==loadGeneration)return;PrismAPI.toast("Could not load calendar: "+e.message);return;}
  render();
}

function render() {
  const cal = $('cal'); cal.innerHTML = '';
  if (mode === 'month') renderMonth(cal);
  else if (mode === 'agenda') renderAgenda(cal);
  else renderTimeGrid(cal, mode === 'week' ? 7 : 1);
}

// ── Month ──
function renderMonth(cal) {
  const wrap = el('div', 'month');
  const wds = el('div', 'weekdays'); wds.innerHTML = WD.map(d => `<div>${d}</div>`).join('');
  const weeks = el('div', 'weeks');
  wrap.appendChild(wds); wrap.appendChild(weeks);
  cal.appendChild(wrap);

  const y = view.getFullYear(), m = view.getMonth();
  const gridStart = new Date(y, m, 1 - ((new Date(y, m, 1).getDay() + 6) % 7));
  const todayStr = ymd(new Date());
  const byDay = {};
  for (const ev of events) (byDay[ymd(eventStart(ev))] = byDay[ymd(eventStart(ev))] || []).push(ev);

  for (let i = 0; i < 42; i++) {
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    const key = ymd(d);
    const cell = el('div', 'cell' + (d.getMonth() !== m ? ' dim' : '') + (key === todayStr ? ' today' : ''));
    cell.onclick = () => openForm(key);
    const num = el('div', 'dnum'); num.textContent = d.getDate(); cell.appendChild(num);
    const dayEvents = events.filter(ev=>occursOn(ev,d)).sort((a, b) => a.startAt.localeCompare(b.startAt));
    for (const ev of dayEvents.slice(0, 3)) {
      const chip = el('div', 'ev');
      const t = eventStart(ev);
      const time = !isAllDay(ev) ? `<span class="t">${pad(t.getHours())}:${pad(t.getMinutes())}</span> ` : '';
      chip.innerHTML = time + esc(ev.title);
      chip.title = `${ev.title} · ${evRange(ev)}${ev.location ? ' @ ' + ev.location : ''}`;
      chip.onclick = (e) => { e.stopPropagation(); openEvent(ev); };
      cell.appendChild(chip);
    }
    if (dayEvents.length > 3) { const more = el('div', 'ev-more'); more.textContent = `+${dayEvents.length - 3} more`; cell.appendChild(more); }
    weeks.appendChild(cell);
  }
}

// ── Time grid (week / day) ──
// Pack overlapping events into side-by-side columns.
function layout(evs,day) {
  const items = evs.map(ev => {
    const s=eventStart(ev),e=eventEnd(ev),next=new Date(day);next.setDate(next.getDate()+1);
    const start=s<day?0:minutesOf(s);
    return {ev,start,end:e>=next?1440:Math.max(minutesOf(e),start+20)};
  }).sort((a, b) => a.start - b.start || a.end - b.end);
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    const colsEnd = [];
    for (const it of cluster) {
      let placed = false;
      for (let c = 0; c < colsEnd.length; c++) { if (it.start >= colsEnd[c]) { it.col = c; colsEnd[c] = it.end; placed = true; break; } }
      if (!placed) { it.col = colsEnd.length; colsEnd.push(it.end); }
    }
    for (const it of cluster) it.cols = colsEnd.length;
  };
  for (const it of items) {
    if (cluster.length && it.start >= clusterEnd) { flush(); cluster = []; clusterEnd = -1; }
    cluster.push(it); clusterEnd = Math.max(clusterEnd, it.end);
  }
  if (cluster.length) flush();
  return items;
}

function renderTimeGrid(cal, ndays) {
  const base = ndays === 7 ? weekStart(view) : startOfDay(view);
  const days = []; for (let i = 0; i < ndays; i++) { const d = new Date(base); d.setDate(base.getDate() + i); days.push(d); }
  const todayStr = ymd(new Date());
  const colsCss = `repeat(${ndays},minmax(0,1fr))`;

  const tg = el('div', 'tg');

  const head = el('div', 'tg-head');
  head.appendChild(el('div', 'tg-corner'));
  const hc = el('div', 'tg-headcols'); hc.style.gridTemplateColumns = colsCss;
  for (const d of days) {
    const dh = el('div', 'tg-dh' + (ymd(d) === todayStr ? ' today' : ''));
    dh.innerHTML = `${WD[(d.getDay() + 6) % 7]}<span class="dnum2">${d.getDate()}</span>`;
    dh.onclick = () => { view = new Date(d); setMode('day'); };
    hc.appendChild(dh);
  }
  head.appendChild(hc); tg.appendChild(head);

  // all-day row
  const ad = el('div', 'tg-allday');
  const lab = el('div', 'lab'); lab.textContent = 'all-day'; ad.appendChild(lab);
  const adcols = el('div', 'tg-adcols'); adcols.style.gridTemplateColumns = colsCss;
  for (const d of days) {
    const key = ymd(d);
    const cell = el('div', 'tg-adcell');
    cell.onclick = (e) => { if (e.target === cell) openForm(key, null, true); };
    for (const ev of events.filter(e => isAllDay(e) && occursOn(e,d))) {
      const c = el('div', 'ad-ev'); c.textContent = ev.title; c.title = ev.title + (ev.location ? ' @ ' + ev.location : '');
      c.onclick = (e) => { e.stopPropagation(); openEvent(ev); };
      cell.appendChild(c);
    }
    adcols.appendChild(cell);
  }
  ad.appendChild(adcols); tg.appendChild(ad);

  // scrollable body
  const scroll = el('div', 'tg-scroll');
  const gutter = el('div', 'tg-gutter');
  for (let h = 0; h < 24; h++) { const hh = el('div', 'tg-hour'); hh.style.height = HOUR_H + 'px'; hh.innerHTML = h === 0 ? '' : `<span>${pad(h)}:00</span>`; gutter.appendChild(hh); }
  scroll.appendChild(gutter);
  const cols = el('div', 'tg-cols'); cols.style.gridTemplateColumns = colsCss;
  for (const d of days) {
    const key = ymd(d);
    const col = el('div', 'tg-col'); col.style.height = (HOUR_H * 24) + 'px';
    for (let h = 1; h < 24; h++) { const ln = el('div', 'tg-line'); ln.style.top = (h * HOUR_H) + 'px'; col.appendChild(ln); }
    col.onclick = (e) => {
      if (e.target !== col) return;
      const mins = Math.max(0, Math.min(23 * 60 + 30, Math.round(e.offsetY / HOUR_H * 60 / 30) * 30));
      openForm(key, pad(Math.floor(mins / 60)) + ':' + pad(mins % 60));
    };
    for (const it of layout(events.filter(ev => !isAllDay(ev) && occursOn(ev,d)),d)) {
      const ev = it.ev, s = eventStart(ev);
      const box = el('div', 'tg-ev');
      box.style.top = (it.start / 60 * HOUR_H) + 'px';
      box.style.height = Math.max(15, (it.end - it.start) / 60 * HOUR_H - 2) + 'px';
      box.style.left = `calc(${(it.col / it.cols * 100).toFixed(2)}% + 2px)`;
      box.style.width = `calc(${(100 / it.cols).toFixed(2)}% - 4px)`;
      box.innerHTML = `<span class="et">${pad(s.getHours())}:${pad(s.getMinutes())}</span> ${esc(ev.title)}`;
      box.title = `${ev.title} · ${evRange(ev)}${ev.location ? ' @ ' + ev.location : ''}`;
      box.onclick = (e) => { e.stopPropagation(); openEvent(ev); };
      col.appendChild(box);
    }
    cols.appendChild(col);
  }
  scroll.appendChild(cols); tg.appendChild(scroll); cal.appendChild(tg);
  requestAnimationFrame(() => {
    scroll.scrollTop = 7 * HOUR_H;
    // The scrollable body has a vertical scrollbar that the header/all-day rows
    // don't — reserve the same width on them so the columns line up.
    const sb = scroll.offsetWidth - scroll.clientWidth;
    if (sb > 0) { head.style.marginRight = sb + 'px'; ad.style.marginRight = sb + 'px'; }
  });
}

// ── Agenda ──
function renderAgenda(cal) {
  const ag = el('div', 'agenda');
  const todayStr = ymd(new Date());
  const bound = startOfDay(view).getTime();
  const list = events.filter(ev => eventEnd(ev).getTime() > bound).sort((a, b) => a.startAt.localeCompare(b.startAt));
  if (!list.length) { ag.innerHTML = '<div class="ag-empty">No upcoming events</div>'; cal.appendChild(ag); return; }
  let curKey = null;
  for (const ev of list) {
    const d = eventStart(ev), key = ymd(d);
    if (key !== curKey) {
      curKey = key;
      const h = el('div', 'ag-day' + (key === todayStr ? ' today' : ''));
      h.textContent = d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
      ag.appendChild(h);
    }
    const row = el('div', 'ag-row'); row.onclick = () => openEvent(ev);
    row.innerHTML = `<div class="ag-time">${esc(evRange(ev))}</div><div class="ag-main"><div class="ag-title">${esc(ev.title)}</div>${ev.location ? `<div class="ag-loc">@ ${esc(ev.location)}</div>` : ''}</div>`;
    ag.appendChild(row);
  }
  cal.appendChild(ag);
}

// Human time range "09:00–10:30", "09:00" (no end), or "All day".
function evRange(ev) {
  if (isAllDay(ev)) {const last=eventEnd(ev);last.setDate(last.getDate()-1);return ymd(last)===ymd(eventStart(ev))?'All day':'All day · '+shortDate(eventStart(ev))+'–'+shortDate(last);}
  const s = eventStart(ev);
  let str = `${pad(s.getHours())}:${pad(s.getMinutes())}`;
  if (ev.endAt) { const e = new Date(ev.endAt); str += `–${ymd(e)!==ymd(s)?shortDate(e)+' ':''}${pad(e.getHours())}:${pad(e.getMinutes())}`; }
  return str;
}

// ── Event modal (create / edit) ────────────────────────────────────────────────
let editing = null;
function toggleTimes() { $('f-times').style.display = $('f-allday').checked ? 'none' : ''; }
$('f-allday').addEventListener('change', toggleTimes);
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeForm(); });

let calendarEditorGeneration = 0, calendarSaving = false;
function publishCalendarContext() { if (typeof calendarEditor !== 'undefined') calendarEditor.publish(); }
function openForm(dateKey, start, allday) {
  calendarEditorGeneration++;
  editing = null;
  $('form-title').textContent = 'New event';
  $('f-del').style.display = 'none';
  const s = start || '09:00';
  const [hh, mm] = s.split(':').map(Number);
  const endM = hh * 60 + mm + 60;
  const end = pad(Math.floor(endM / 60) % 24) + ':' + pad(endM % 60);
  const last = new Date(dateKey+'T00:00');
  if (!allday && endM >= 1440) last.setDate(last.getDate()+1);
  setFields({ title: '', date: dateKey, enddate: ymd(last), allday: !!allday, start: s, end, loc: '', desc: '' });
  $('f-err').textContent = '';
  $('overlay').classList.add('open');
  publishCalendarContext();
  setTimeout(() => $('f-title').focus(), 30);
}
function openEvent(ev) {
  calendarEditorGeneration++;
  editing = ev;
  $('form-title').textContent = 'Edit event';
  $('f-del').style.display = '';
  const s=eventStart(ev), e=ev.endAt?eventEnd(ev):null;
  if(isAllDay(ev)&&e)e.setDate(e.getDate()-1);
  setFields({
    title: ev.title || '', date: ymd(s), enddate:e?ymd(e):ymd(s), allday: isAllDay(ev),
    start: `${pad(s.getHours())}:${pad(s.getMinutes())}`,
    end: e ? `${pad(e.getHours())}:${pad(e.getMinutes())}` : '',
    loc: ev.location || '', desc: ev.description || '',
  });
  $('f-err').textContent = '';
  $('overlay').classList.add('open');
  publishCalendarContext();
  try {
    publishCalendarContext();
    parent.postMessage({ type: 'suggest', items: [{ label: '✅ Make a task', prompt: 'Create a task to prepare for this event', send: true }] }, '*');
  } catch (_) {}
}
function setFields(v) {
  $('f-title').value = v.title; $('f-date').value = v.date; $('f-enddate').value=v.enddate||v.date;
  $('f-allday').checked = v.allday;
  $('f-start').value = v.start; $('f-end').value = v.end;
  $('f-loc').value = v.loc; $('f-desc').value = v.desc;
  toggleTimes();
}
function closeForm() {
  $('overlay').classList.remove('open');
  try {
    publishCalendarContext();
    parent.postMessage({ type: 'suggest', items: [] }, '*');
  } catch (_) {}
}

async function saveForm() {
  if (calendarSaving) return;
  const title = $('f-title').value.trim(), date = $('f-date').value;
  if (!title) { $('f-err').textContent = 'Title is required.'; return; }
  if (!date) { $('f-err').textContent = 'Date is required.'; return; }
  let start, end='';const enddate=$('f-enddate').value||date;
  const all_day=$('f-allday').checked;
  if(all_day){start=date;const exclusive=new Date(enddate+'T00:00');exclusive.setDate(exclusive.getDate()+1);end=ymd(exclusive);}
  else {start=new Date(`${date}T${$('f-start').value||'00:00'}`).toISOString();if($('f-end').value)end=new Date(`${enddate}T${$('f-end').value}`).toISOString();}
  if(end && new Date(end)<=new Date(start)){$('f-err').textContent='End must be after start.';return;}
  const body={title,start,end,all_day,location:$('f-loc').value.trim(),description:$('f-desc').value.trim()};
  // In-place update (PUT) when editing — no more delete-then-recreate, which
  // lost the event outright if the second call (the recreate) ever failed.
  const url = editing
    ? `/api/events?session=${encodeURIComponent(session)}&id=${encodeURIComponent(editing.id)}`
    : `/api/events?session=${encodeURIComponent(session)}`;
  calendarSaving=true;
  try{await PrismAPI.api(url,PrismAPI.body(editing?'PUT':'POST',body));closeForm();load();}
  catch(e){$('f-err').textContent=e.message;}
  finally{calendarSaving=false;}

}
async function deleteEvent() {
  if (!editing) return;
  if (!await PrismModal.confirm(`Delete "${editing.title}"?`, { danger: true })) return;
  // The result was ignored: a refused delete (one occurrence of a recurring
  // series) closed the form as if it had worked, and the event came back on
  // the next load with no explanation.
  try{await PrismAPI.api(`/api/events?session=${encodeURIComponent(session)}&id=${encodeURIComponent(editing.id)}`,{method:'DELETE'});closeForm();load();}
  catch(e){$('f-err').textContent=e.message;}

}
function addToday() { openForm(ymd(new Date())); }

const calendarEditor = PrismEditor.connect({
  fields:['title','start','end','all_day','location','description'], types:{all_day:'boolean'},
  read:() => {
    if (!$('overlay').classList.contains('open')) return null;
    const all=$('f-allday').checked, start=$('f-date').value, end=$('f-enddate').value;
    return {app:'calendar',id:String(calendarEditorGeneration),event_id:editing?.id||null,title:$('f-title').value,start:all?start:start+'T'+($('f-start').value||'00:00'),end:all?(end?PrismPIM.shift(end,1):''):(end&&$('f-end').value?end+'T'+$('f-end').value:''),all_day:all,location:$('f-loc').value,description:$('f-desc').value,timezone:PrismPIM.timezone(),readonly:calendarSaving,persistence:'form only; user must Save'};
  },
  context:s=>`Editing ${s.event_id?'event '+s.event_id:'a new calendar event'}: ${s.title || '(empty)'}. Changes stay in the form until Save.`,
  idleContext:()=>`Viewing the calendar — ${$('title').textContent}`,
  update:patch=>{
    const next=PrismPIM.calendarPatch(calendarEditor.snapshot(),patch);
    setFields({title:next.title,date:next.start.slice(0,10),enddate:next.end?(next.all_day?PrismPIM.shift(next.end,-1):next.end.slice(0,10)):next.start.slice(0,10),allday:next.all_day,start:next.all_day?$('f-start').value:next.start.slice(11,16),end:next.all_day?$('f-end').value:next.end.slice(11,16),loc:next.location,desc:next.description});
    $('f-err').textContent='';
  }
});

// Reload when the agent changes calendar data via chat.
addEventListener('message', e => { if (e.data && e.data.type === 'data-changed') load(); });

load();
</script>
</body>
