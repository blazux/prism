<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documents</title>
<link rel="stylesheet" href="/widget-base.css">
<script src="/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script>
  addEventListener('message', e => {
    if (e.data && e.data.type === 'prism-theme' && e.data.vars) {
      const r = document.documentElement.style;
      for (const k in e.data.vars) r.setProperty(k, e.data.vars[k]);
    }
  });
</script>
<style>
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .app { display: flex; height: 100%; }

  .list-pane { width: 250px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .list-head { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
  .list-head input { flex: 1; }
  .docs { flex: 1; overflow-y: auto; }
  .doc-row { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; }
  .doc-row:hover { background: var(--bg2); }
  .doc-row.active { background: var(--bg3); box-shadow: inset 2px 0 0 var(--accent); }
  .doc-row .dt { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc-row .dd { font-size: 11px; color: var(--text3); margin-top: 2px; }

  .editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor-head { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .editor-head .title-in { flex: 1; font-size: 16px; font-weight: 600; background: none; border: none; padding: 4px 0; color: var(--text); }
  .editor-head .title-in:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .seg { display: flex; border: 1px solid var(--border2); border-radius: 6px; overflow: hidden; }
  .seg button { background: var(--bg2); border: none; color: var(--text2); font: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer; }
  .seg button.active { background: var(--bg3); color: var(--accent); }

  .ai-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--border); align-items: center; }
  .ai-bar .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; margin-right: 2px; }
  .ai-btn { font-size: 12px; background: var(--bg2); border: 1px solid var(--border2); color: var(--text2); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .ai-btn:hover { color: var(--accent); border-color: var(--accent); }
  .ai-btn:disabled { opacity: .5; cursor: default; }

  .panes { flex: 1; display: flex; min-height: 0; }
  .panes textarea { flex: 1; resize: none; border: none; border-radius: 0; padding: 16px 18px; line-height: 1.6; font-size: 14px; min-width: 0; }
  .panes textarea:focus { outline: none; }
  .md-preview { flex: 1; overflow-y: auto; padding: 16px 18px; line-height: 1.65; min-width: 0; border-left: 1px solid var(--border); }
  .app.view-edit .md-preview { display: none; }
  .app.view-edit .md-preview { border: none; }
  .app.view-preview .panes textarea { display: none; }
  .app.view-preview .md-preview { border-left: none; }
  .md-preview h1,.md-preview h2,.md-preview h3 { margin: .7em 0 .35em; line-height: 1.25; }
  .md-preview p { margin: .5em 0; }
  .md-preview ul,.md-preview ol { padding-left: 1.4em; }
  .md-preview code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .md-preview pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; }
  .md-preview pre code { background: none; padding: 0; }
  .md-preview a { color: var(--accent); }
  .md-preview blockquote { border-left: 3px solid var(--border2); margin: .6em 0; padding-left: 12px; color: var(--text2); }
  .md-preview table { border-collapse: collapse; } .md-preview td,.md-preview th { border: 1px solid var(--border); padding: 4px 8px; }

  .ai-result { border-top: 1px solid var(--accent); background: var(--bg2); padding: 10px 14px; display: none; flex-direction: column; gap: 8px; max-height: 38%; }
  .ai-result.open { display: flex; }
  .ai-result .arh { display: flex; align-items: center; gap: 8px; }
  .ai-result .arh .lbl { font-size: 11px; color: var(--accent); font-weight: 600; flex: 1; }
  .ai-result .artext { overflow-y: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.55; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .ai-result .arf { display: flex; gap: 8px; }

  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text3); flex-direction: column; gap: 8px; }
  .empty .big { font-size: 36px; opacity: .3; }
  .back-btn { display: none; }

  /* prompt modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .pform { width: min(420px, 92vw); background: var(--bg1); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .pform .ttl { font-weight: 600; color: var(--text); }
  .pform input { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 7px 9px; font: inherit; }
  .pform .pf-foot { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 620px) {
    .list-pane { width: 100%; }
    .app.editing .list-pane { display: none; }
    .app:not(.editing) .editor { display: none; }
    .app .md-preview { display: none; }
    .back-btn { display: inline-flex; }
  }
</style>
</head>
<body>
  <div class="app view-split" id="app">
    <div class="list-pane">
      <div class="list-head">
        <input id="search" placeholder="Search documents…">
        <button class="btn btn-accent" onclick="newDoc()">＋ New</button>
      </div>
      <div class="docs" id="docs"></div>
    </div>

    <div class="editor">
      <div class="empty" id="empty">
        <div class="big">✎</div>
        <div>Select a document, or create one</div>
      </div>
      <div id="editor" style="display:none; height:100%; flex-direction:column; min-height:0;">
        <div class="editor-head">
          <button class="btn back-btn" onclick="closeEditor()">←</button>
          <input class="title-in" id="d-title" placeholder="Untitled">
          <div class="seg">
            <button id="v-edit" onclick="setMode('edit')">Edit</button>
            <button id="v-split" class="active" onclick="setMode('split')">Split</button>
            <button id="v-preview" onclick="setMode('preview')">Preview</button>
          </div>
          <button class="btn" onclick="saveDoc()">Save</button>
          <button class="btn" onclick="deleteDoc()" title="Delete" style="color:var(--red)">🗑</button>
        </div>
        <div class="ai-bar">
          <span class="lbl">✨ AI</span>
          <button class="ai-btn" data-task="doc_rewrite">Rewrite</button>
          <button class="ai-btn" data-task="doc_continue">Continue</button>
          <button class="ai-btn" data-task="doc_grammar">Fix grammar</button>
          <button class="ai-btn" data-task="doc_shorten">Shorten</button>
          <button class="ai-btn" data-task="doc_summarize">Summarize</button>
          <button class="ai-btn" onclick="customAI()">Custom…</button>
          <span id="ai-scope" style="font-size:11px;color:var(--text3);margin-left:auto"></span>
        </div>
        <div class="panes">
          <textarea id="d-body" placeholder="Start writing… Markdown is supported. Select text, then use an AI action — or run it on the whole document."></textarea>
          <div class="md-preview" id="d-preview"></div>
        </div>
        <div class="ai-result" id="ai-result">
          <div class="arh"><span class="lbl" id="ar-title">✨ Result</span></div>
          <div class="artext" id="ar-text"></div>
          <div class="arf">
            <button class="btn btn-accent" id="ar-replace" onclick="applyResult('replace')">Replace</button>
            <button class="btn" onclick="applyResult('insert')">Insert at cursor</button>
            <button class="btn" onclick="applyResult('copy')">Copy</button>
            <button class="btn" onclick="closeResult()" style="margin-left:auto">Dismiss</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="pform">
      <div class="ttl">Custom AI instruction</div>
      <input id="p-instr" placeholder="e.g. Make this sound more formal">
      <div class="pf-foot">
        <button class="btn" onclick="closePrompt()">Cancel</button>
        <button class="btn btn-accent" onclick="runCustom()">Run</button>
      </div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
const api = (path, opts) => fetch(`/api/documents${path}`, opts).then(r => r.json());
let docs = [], selectedId = null, filter = '', mode = 'split', lastTarget = null;

function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

async function load() {
  docs = (await api('').catch(() => ({}))).documents || [];
  renderList();
}

function renderList() {
  const host = $('docs'); host.innerHTML = '';
  const f = filter.toLowerCase();
  const shown = docs.filter(d => !f || (d.title + ' ' + d.body).toLowerCase().includes(f));
  for (const d of shown) {
    const row = document.createElement('div');
    row.className = 'doc-row' + (d.id === selectedId ? ' active' : '');
    row.onclick = () => select(d.id);
    const when = d.updatedAt ? new Date(d.updatedAt).toLocaleDateString([], { month: 'short', day: 'numeric' }) : '';
    row.innerHTML = `<div class="dt">${esc(d.title) || '(untitled)'}</div><div class="dd">${esc((d.body || '').replace(/[#*`>\n]/g, ' ').trim().slice(0, 50)) || '—'} · ${when}</div>`;
    host.appendChild(row);
  }
  if (!shown.length) host.innerHTML = '<div class="empty" style="padding:30px"><div>No documents</div></div>';
}

function select(id) {
  selectedId = id;
  const d = docs.find(x => x.id === id);
  if (!d) return;
  try { parent.postMessage({ type: 'context', text: `Editing a document titled "${d.title || 'untitled'}"` }, '*'); } catch (_) {}
  $('empty').style.display = 'none';
  $('editor').style.display = 'flex';
  $('d-title').value = d.title || '';
  $('d-body').value = d.body || '';
  closeResult();
  updatePreview();
  $('app').classList.add('editing');
  renderList();
}

async function newDoc() {
  const { id } = await api('', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: 'Untitled', body: '' }) });
  await load();
  select(id);
  $('d-title').focus(); $('d-title').select();
}

async function saveDoc() {
  if (!selectedId) return;
  await api('', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: selectedId, title: $('d-title').value, body: $('d-body').value }) });
  await load();
}

async function deleteDoc() {
  if (!selectedId || !confirm('Delete this document?')) return;
  await fetch(`/api/documents?id=${selectedId}`, { method: 'DELETE' });
  selectedId = null; closeEditor(); await load();
}

function closeEditor() { $('editor').style.display = 'none'; $('empty').style.display = 'flex'; $('app').classList.remove('editing'); }

function setMode(m) {
  mode = m;
  $('app').className = 'app view-' + m + ($('app').classList.contains('editing') ? ' editing' : '');
  ['edit', 'split', 'preview'].forEach(x => $('v-' + x).classList.toggle('active', x === m));
  if (m !== 'edit') updatePreview();
}
function updatePreview() {
  if (mode === 'edit') return;
  $('d-preview').innerHTML = window.marked ? marked.parse($('d-body').value || '') : esc($('d-body').value);
}

// ── AI actions ──────────────────────────────────────────────────────────────
function aiTarget() {
  const ta = $('d-body');
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s !== e) return { text: ta.value.slice(s, e), start: s, end: e, isSel: true };
  return { text: ta.value, start: 0, end: ta.value.length, isSel: false };
}
async function assist(task, text, instruction) {
  const r = await fetch('/api/ai/assist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task, text, instruction: instruction || '' }) });
  if (!r.ok) throw new Error(await r.text());
  return (await r.json()).result || '';
}
async function runAI(task, instruction, label) {
  const tgt = aiTarget();
  if (!tgt.text.trim()) { return; }
  lastTarget = tgt;
  $('ar-title').textContent = '✨ ' + (label || 'Result') + (tgt.isSel ? ' (selection)' : ' (whole document)');
  $('ar-text').textContent = 'Working…';
  $('ai-result').classList.add('open');
  document.querySelectorAll('.ai-btn').forEach(b => b.disabled = true);
  try { $('ar-text').textContent = await assist(task, tgt.text, instruction); }
  catch (e) { $('ar-text').textContent = 'Failed: ' + e.message; }
  finally { document.querySelectorAll('.ai-btn').forEach(b => b.disabled = false); }
}
function applyResult(how) {
  const ta = $('d-body'), text = $('ar-text').textContent;
  if (how === 'copy') { navigator.clipboard?.writeText(text); return; }
  const t = lastTarget || { start: ta.value.length, end: ta.value.length };
  if (how === 'replace') {
    ta.value = ta.value.slice(0, t.start) + text + ta.value.slice(t.end);
  } else { // insert at caret (or end)
    const at = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    ta.value = ta.value.slice(0, at) + text + ta.value.slice(at);
  }
  updatePreview(); closeResult(); saveDoc();
}
function closeResult() { $('ai-result').classList.remove('open'); }

// Custom instruction modal
function customAI() { $('p-instr').value = ''; $('overlay').classList.add('open'); setTimeout(() => $('p-instr').focus(), 30); }
function closePrompt() { $('overlay').classList.remove('open'); }
function runCustom() {
  const instr = $('p-instr').value.trim();
  closePrompt();
  if (instr) runAI('custom', instr, 'Custom');
}
$('p-instr').addEventListener('keydown', e => { if (e.key === 'Enter') runCustom(); });

document.querySelectorAll('.ai-btn[data-task]').forEach(b =>
  b.addEventListener('click', () => runAI(b.dataset.task, '', b.textContent)));

// Show whether AI will act on a selection or the whole doc.
$('d-body').addEventListener('select', updateScope);
$('d-body').addEventListener('keyup', updateScope);
$('d-body').addEventListener('mouseup', updateScope);
function updateScope() {
  const ta = $('d-body');
  $('ai-scope').textContent = ta.selectionStart !== ta.selectionEnd ? 'AI → selection' : 'AI → whole doc';
}

$('search').addEventListener('input', e => { filter = e.target.value; renderList(); });
$('d-body').addEventListener('input', () => { if (mode !== 'edit') updatePreview(); });
['d-title', 'd-body'].forEach(id => $(id).addEventListener('blur', () => { if (selectedId) saveDoc(); }));

setMode('split');
load();
</script>
</body>
</html>
