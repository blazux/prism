<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes</title>
<link rel="stylesheet" href="/widget-base.css">
<script src="/theme.js"></script>
<script src="/modal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script>
  addEventListener('message', e => {
    if (e.data && e.data.type === 'prism-theme' && e.data.vars) {
      const r = document.documentElement.style;
      for (const k in e.data.vars) r.setProperty(k, e.data.vars[k]);
    }
  });
</script>
<style>
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .app { display: flex; height: 100%; }

  /* List pane */
  .list-pane { width: 290px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .list-head { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid var(--border); }
  .list-head input { flex: 1; }
  .btn-new { white-space: nowrap; }
  .tag-bar { display: flex; gap: 5px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .tag-chip { font-size: 11px; padding: 2px 9px; border-radius: 999px; background: var(--bg2); color: var(--text2); border: 1px solid var(--border2); cursor: pointer; }
  .tag-chip:hover { color: var(--text); }
  .tag-chip.active { background: var(--bg3); color: var(--accent); border-color: var(--accent); }
  .notes { flex: 1; overflow-y: auto; }
  .note-row { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; }
  .note-row:hover { background: var(--bg2); }
  .note-row.active { background: var(--bg3); box-shadow: inset 2px 0 0 var(--accent); }
  .nt-row { display: flex; align-items: center; gap: 6px; }
  .note-row .nt { flex: 1; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-pin { background: none; border: none; cursor: pointer; font-size: 12px; padding: 0 2px; line-height: 1; color: var(--text3); opacity: 0; transition: opacity .12s, color .12s; }
  .note-row:hover .note-pin { opacity: .6; }
  .note-pin.pinned { opacity: 1; color: var(--accent); }
  .note-row .ns { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .note-row .ntags { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--bg3); color: var(--text2); }

  /* Editor pane */
  .editor { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .editor-head { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .editor-head .title-in { flex: 1; font-size: 16px; font-weight: 600; background: none; border: none; padding: 4px 0; color: var(--text); }
  .editor-head .title-in:focus { outline: none; border-bottom: 1px solid var(--accent); }
  .tags-in { font-size: 12px; margin: 8px 14px 0; }
  .seg { display: flex; border: 1px solid var(--border2); border-radius: 6px; overflow: hidden; }
  .seg button { background: var(--bg2); border: none; color: var(--text2); font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
  .seg button.active { background: var(--bg3); color: var(--accent); }

  .ai-bar { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px; border-bottom: 1px solid var(--border); align-items: center; }
  .ai-bar .ai-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; }
  .ai-btn { font-size: 12px; background: var(--bg2); border: 1px solid var(--border2); color: var(--text2); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .ai-btn:hover { color: var(--accent); border-color: var(--accent); }
  .ai-btn:disabled { opacity: .5; cursor: default; }
  .ai-scope { font-size: 11px; color: var(--text3); margin-left: auto; }

  .panes { flex: 1; display: flex; min-height: 0; }
  .panes textarea { flex: 1; resize: none; border: none; line-height: 1.5; padding: 12px 14px; min-width: 0; font: inherit; font-size: 14px; background: none; color: var(--text); }
  .panes textarea:focus { outline: none; }
  .md-preview { flex: 1; overflow-y: auto; line-height: 1.55; padding: 12px 14px; min-width: 0; }
  #editor.mode-edit .md-preview { display: none; }
  #editor.mode-preview .panes textarea { display: none; }
  #editor.mode-split .md-preview { border-left: 1px solid var(--border); }
  .md-preview h1,.md-preview h2,.md-preview h3 { margin: .6em 0 .3em; }
  .md-preview ul,.md-preview ol { padding-left: 1.3em; }
  .md-preview code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; }
  .md-preview pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto; }
  .md-preview pre code { background: none; padding: 0; }
  .md-preview a { color: var(--accent); }
  .md-preview blockquote { border-left: 3px solid var(--border2); margin: .5em 0; padding-left: 10px; color: var(--text2); }
  .md-preview .wikilink { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); cursor: pointer; }
  .md-preview .wikilink.missing { color: var(--red); border-bottom-color: color-mix(in srgb, var(--red) 45%, transparent); }

  .ai-result { border-top: 1px solid var(--accent); background: var(--bg2); padding: 10px 14px; display: none; flex-direction: column; gap: 8px; max-height: 40%; }
  .ai-result.open { display: flex; }
  .ai-result .lbl { font-size: 11px; color: var(--accent); font-weight: 600; }
  .ai-result .artext { overflow-y: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.55; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .ai-result .arf { display: flex; gap: 8px; }

  .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text3); flex-direction: column; gap: 8px; }
  .empty .big { font-size: 36px; opacity: .3; }
  .back-btn { display: none; }

  /* custom-instruction modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10; }
  .overlay.open { display: flex; }
  .pform { width: min(420px, 92vw); background: var(--bg1); border: 1px solid var(--border2); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .pform .ttl { font-weight: 600; color: var(--text); }
  .pform input, .pform select { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 7px 9px; font: inherit; width: 100%; box-sizing: border-box; }
  .pform label { font-size: 11px; color: var(--text2); display: flex; flex-direction: column; gap: 4px; }
  .pform .pf-err { color: var(--red); font-size: 12px; min-height: 14px; }
  .pform .pf-foot { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 560px) {
    .list-pane { width: 100%; }
    .app.editing .list-pane { display: none; }
    .app:not(.editing) .editor { display: none; }
    .app .md-preview { display: none; }
    .back-btn { display: inline-flex; }
  }
</style>
</head>
<body>
  <div class="app" id="app">
    <div class="list-pane">
      <div class="list-head">
        <input id="search" placeholder="Search notes…">
        <button class="btn btn-accent btn-new" onclick="newNote()">＋ New</button>
        <span id="src-badge" style="display:none;font-size:11px;color:var(--text3);border:1px solid var(--border);border-radius:999px;padding:2px 9px;white-space:nowrap"></span>
      </div>
      <div class="tag-bar" id="tag-bar"></div>
      <div class="notes" id="notes"></div>
    </div>

    <div class="editor">
      <div class="empty" id="empty">
        <div class="big">📝</div>
        <div>Select a note, or create one</div>
      </div>
      <div id="editor" class="mode-edit" style="display:none; height:100%; flex-direction:column; min-height:0;">
        <div class="editor-head">
          <button class="btn back-btn" onclick="closeEditor()">←</button>
          <input class="title-in" id="e-title" placeholder="Title">
          <div class="seg">
            <button id="tab-edit" class="active" onclick="setMode('edit')">Edit</button>
            <button id="tab-split" onclick="setMode('split')">Split</button>
            <button id="tab-preview" onclick="setMode('preview')">Preview</button>
          </div>
          <button class="btn" id="share-btn" onclick="toggleShare()" title="Share this note with your group" style="display:none">📤 Share</button>
          <button class="btn" id="kn-btn" onclick="addToKnowledge()" title="Add this note to the agent's knowledge base (RAG)" style="display:none">🧠</button>
          <button class="btn" id="save-btn" onclick="saveNote()">Save</button>
          <button class="btn" id="del-btn" onclick="deleteNote()" title="Delete" style="color:var(--red)">🗑</button>
        </div>
        <input class="tags-in" id="e-tags" placeholder="tags, comma, separated">
        <div class="ai-bar">
          <span class="ai-lbl">✨ AI</span>
          <button class="ai-btn" data-task="doc_rewrite">Rewrite</button>
          <button class="ai-btn" data-task="doc_continue">Continue</button>
          <button class="ai-btn" data-task="doc_grammar">Fix grammar</button>
          <button class="ai-btn" data-task="doc_shorten">Shorten</button>
          <button class="ai-btn" data-task="doc_summarize">Summarize</button>
          <button class="ai-btn" onclick="customAI()">Custom…</button>
          <span class="ai-scope" id="ai-scope"></span>
        </div>
        <div class="panes">
          <textarea id="e-body" placeholder="Write your note… Markdown supported. Link to another note with [[Title]]. Select text, then use an AI action — or run it on the whole note."></textarea>
          <div class="md-preview" id="e-preview"></div>
        </div>
        <div class="ai-result" id="ai-result">
          <div class="lbl" id="ar-title">✨ Result</div>
          <div class="artext" id="ar-text"></div>
          <div class="arf">
            <button class="btn btn-accent" onclick="applyResult('replace')">Replace</button>
            <button class="btn" onclick="applyResult('insert')">Insert at cursor</button>
            <button class="btn" onclick="applyResult('copy')">Copy</button>
            <button class="btn" onclick="closeResult()" style="margin-left:auto">Dismiss</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="pform">
      <div class="ttl">Custom AI instruction</div>
      <input id="p-instr" placeholder="e.g. Make this sound more formal">
      <div class="pf-foot">
        <button class="btn" onclick="closePrompt()">Cancel</button>
        <button class="btn btn-accent" onclick="runCustom()">Run</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="kn-overlay">
    <div class="pform">
      <div class="ttl">🧠 Add to knowledge base</div>
      <label>Collection<select id="kn-col" onchange="toggleKnNew()"></select></label>
      <input id="kn-new" placeholder="New collection name (e.g. research)" style="display:none">
      <div class="pf-err" id="kn-err"></div>
      <div class="pf-foot">
        <button class="btn" onclick="closeKn()">Cancel</button>
        <button class="btn btn-accent" id="kn-go" onclick="confirmKnowledge()">Add</button>
      </div>
    </div>
  </div>

<script>
const session = new URLSearchParams(location.search).get('session') || 'default';
const api = (path, opts) => fetch(`/api/notes${path}`, opts).then(r => r.json());
const $ = id => document.getElementById(id);
let notes = [], selectedId = null, filter = '', tagFilter = '', mode = 'edit', lastTarget = null;

// Capabilities, resolved once at startup:
//  - hasGroup      → the user belongs to a group (can Share notes to it)
//  - canManageRag  → may upsert a note into a RAG base (personal scope, group
//                    admin, or global admin). Plain group members cannot.
let CAPS = { hasGroup: false, canManageRag: true };
async function loadCaps() {
  try {
    const me = await fetch('/api/me').then(r => r.json());
    if (!me.authenticated) { CAPS = { hasGroup: false, canManageRag: true }; return; }
    const globalAdmin = me.user && me.user.role === 'global_admin';
    const groups = ((await fetch('/api/my/groups').then(r => r.json())).groups) || [];
    const hasGroup = groups.length > 0;
    const isGroupAdmin = hasGroup && groups[0].role === 'admin';
    CAPS = { hasGroup, canManageRag: globalAdmin || !hasGroup || isGroupAdmin };
  } catch { CAPS = { hasGroup: false, canManageRag: true }; }
}
const currentNote = () => notes.find(x => x.id === selectedId);

// Pins (client-side, by note id).
const PIN_KEY = 'prism-pinned-notes';
function pins() { try { return new Set(JSON.parse(localStorage.getItem(PIN_KEY) || '[]')); } catch { return new Set(); } }
function isPinned(id) { return pins().has(id); }
function togglePin(id) { const p = pins(); p.has(id) ? p.delete(id) : p.add(id); localStorage.setItem(PIN_KEY, JSON.stringify([...p])); render(); }

const noteTags = n => (n.tags || '').split(',').map(t => t.trim()).filter(Boolean);
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function setSourceBadge(src) {
  const el = document.getElementById('src-badge'); if (!el) return;
  const L = { google: 'Google', microsoft: 'Microsoft', caldav: 'CalDAV', todoist: 'Todoist', vault: 'Vault' };
  if (src && L[src]) { el.textContent = '◦ ' + L[src]; el.style.display = 'inline-block'; } else { el.style.display = 'none'; }
}
// syncEditor=true re-fills the open editor from the server copy. Only the agent-driven
// refresh (data-changed) passes it: render() alone rebuilds the LIST, so without this the
// note you have open keeps showing the pre-agent text until a reload. Routine loads leave
// the editor alone so a background refresh can't yank the field you're typing in.
async function load(syncEditor = false) {
  const data = await api(`?session=${encodeURIComponent(session)}`);
  notes = data.notes || [];
  setSourceBadge(data.source);
  render();
  if (syncEditor) syncEditorFromServer();
}

// Pull the open note's fields back from the server copy. By design the agent's version
// WINS over unsaved local edits: you ask it to complete a note, you want to see its work
// — if it got it wrong, tell it. The view mode (edit/split/preview) is preserved.
function syncEditorFromServer() {
  if (!selectedId) return;
  const n = notes.find(x => x.id === selectedId);
  if (!n) { selectedId = null; closeEditor(); return; } // the agent deleted the open note
  $('e-title').value = n.title || '';
  $('e-tags').value = n.tags || '';
  $('e-body').value = n.body || '';
  applyNoteChrome(n);
  if (mode !== 'edit') updatePreview();
}

function renderTagBar() {
  const bar = $('tag-bar');
  const all = new Set();
  for (const n of notes) for (const t of noteTags(n)) all.add(t);
  if (!all.size) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = `<span class="tag-chip ${tagFilter === '' ? 'active' : ''}" data-t="">All</span>` +
    [...all].sort().map(t => `<span class="tag-chip ${tagFilter === t ? 'active' : ''}" data-t="${esc(t)}">${esc(t)}</span>`).join('');
  bar.querySelectorAll('.tag-chip').forEach(c => c.onclick = () => { tagFilter = c.dataset.t; render(); });
}

function render() {
  renderTagBar();
  const host = $('notes');
  host.innerHTML = '';
  const f = filter.toLowerCase();
  let shown = notes.filter(n =>
    (!f || (n.title + ' ' + n.body + ' ' + n.tags).toLowerCase().includes(f)) &&
    (!tagFilter || noteTags(n).includes(tagFilter)));
  shown.sort((a, b) => (isPinned(b.id) - isPinned(a.id)) || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  for (const n of shown) {
    const row = document.createElement('div');
    row.className = 'note-row' + (n.id === selectedId ? ' active' : '');
    row.onclick = () => select(n.id);
    const tags = noteTags(n).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const shared = n.scope === 'group'
      ? `<span class="tag" title="Shared with your group${n.canEdit ? '' : ' · read-only'}" style="background:rgba(107,138,253,0.16);color:var(--accent)">📤 shared${n.canEdit ? '' : ' · read-only'}</span>`
      : '';
    row.innerHTML = `<div class="nt-row"><span class="nt">${esc(n.title) || '(untitled)'}</span><button class="note-pin ${isPinned(n.id) ? 'pinned' : ''}" title="Pin">📌</button></div>
      <div class="ns">${esc((n.body || '').replace(/\n/g, ' ')) || '—'}</div>
      ${shared || tags ? `<div class="ntags">${shared}${tags}</div>` : ''}`;
    row.querySelector('.note-pin').onclick = (e) => { e.stopPropagation(); togglePin(n.id); };
    host.appendChild(row);
  }
  if (!shown.length) host.innerHTML = '<div class="empty" style="padding:30px"><div>No notes</div></div>';
}

function setMode(m) {
  mode = m;
  $('editor').className = 'mode-' + m;
  ['edit', 'split', 'preview'].forEach(x => $('tab-' + x).classList.toggle('active', x === m));
  if (m !== 'edit') updatePreview();
}
function escAttr(s) { return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

// Render Markdown, turning [[Title]] into wiki links to other notes.
function renderMarkdown(src) {
  const withLinks = (src || '').replace(/\[\[([^\]\n]+)\]\]/g, (_, t) => {
    const title = t.trim();
    const exists = notes.some(x => (x.title || '').toLowerCase() === title.toLowerCase());
    return `<a href="#" class="wikilink${exists ? '' : ' missing'}" data-note="${escAttr(title)}">${esc(title)}</a>`;
  });
  return window.marked ? marked.parse(withLinks) : esc(withLinks);
}
function updatePreview() {
  if (mode === 'edit') return;
  const pv = $('e-preview');
  pv.innerHTML = renderMarkdown($('e-body').value);
  pv.querySelectorAll('.wikilink').forEach(a => a.addEventListener('click', e => { e.preventDefault(); openWikiLink(a.dataset.note); }));
}
async function openWikiLink(title) {
  if (selectedId) await saveNote();
  const n = notes.find(x => (x.title || '').toLowerCase() === title.toLowerCase());
  if (n) { select(n.id); return; }
  if (await PrismModal.confirm(`Note "${title}" doesn't exist yet. Create it?`, { okLabel: 'Create' })) {
    const { id } = await api(`?session=${encodeURIComponent(session)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, body: '', tags: '' })
    });
    await load(); select(id);
  }
}

// Push the current note into the agent's RAG knowledge base — pick a collection.
async function addToKnowledge() {
  if (!selectedId) return;
  if (!$('e-body').value.trim()) { flashKn('🧠', 'Empty'); return; }
  await saveNote();
  const sel = $('kn-col'); sel.innerHTML = '';
  $('kn-err').textContent = ''; $('kn-new').style.display = 'none'; $('kn-new').value = '';
  let cols = [];
  try { const r = await fetch(`/api/rag/collections?session=${encodeURIComponent(session)}`); if (r.ok) cols = await r.json(); } catch (_) {}
  for (const c of (cols || [])) {
    const o = document.createElement('option'); o.value = c.name; o.textContent = `${c.name} (${c.doc_count || 0})`; sel.appendChild(o);
  }
  const nw = document.createElement('option'); nw.value = '__new__'; nw.textContent = '＋ New collection…'; sel.appendChild(nw);
  const hasNotes = (cols || []).some(c => c.name === 'notes');
  sel.value = hasNotes ? 'notes' : (cols && cols.length ? cols[0].name : '__new__');
  toggleKnNew();
  $('kn-overlay').classList.add('open');
}
function toggleKnNew() {
  const isNew = $('kn-col').value === '__new__';
  $('kn-new').style.display = isNew ? '' : 'none';
  if (isNew) setTimeout(() => $('kn-new').focus(), 20);
}
function closeKn() { $('kn-overlay').classList.remove('open'); }
async function confirmKnowledge() {
  let col = $('kn-col').value;
  if (col === '__new__') {
    col = $('kn-new').value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, '-').replace(/^-+|-+$/g, '');
    if (!col) { $('kn-err').textContent = 'Enter a collection name.'; return; }
  }
  const title = ($('e-title').value.trim() || 'note'), body = $('e-body').value;
  const go = $('kn-go'); go.disabled = true; go.textContent = 'Adding…'; $('kn-err').textContent = '';
  try {
    const fd = new FormData();
    fd.append('file', new Blob([`# ${title}\n\n${body}`], { type: 'text/markdown' }), `${title.replace(/[\/\\]/g, '-')}.md`);
    fd.append('collection', col); fd.append('session', session);
    const r = await fetch('/api/rag/upload', { method: 'POST', body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || d.error) throw new Error(d.error || 'failed');
    closeKn(); flashKn('✓', 'Added to ' + col);
  } catch (e) { $('kn-err').textContent = 'Failed: ' + e.message; }
  finally { go.disabled = false; go.textContent = 'Add'; }
}
function flashKn(icon, msg) {
  const btn = $('kn-btn'); btn.textContent = icon; btn.title = msg;
  setTimeout(() => { btn.textContent = '🧠'; btn.title = "Add this note to the agent's knowledge base (RAG)"; }, 2000);
}

function select(id) {
  selectedId = id;
  const n = notes.find(x => x.id === id);
  if (!n) return;
  try {
    const tg = noteTags(n).join(', ');
    parent.postMessage({ type: 'context', text: `Viewing note #${n.id} titled "${n.title || 'untitled'}"${tg ? ` (tags: ${tg})` : ''} in the Notes app. To act on "this note" use the note tool with id=${n.id}.` }, '*');
    parent.postMessage({ type: 'suggest', items: [
      { label: '📅 To event', prompt: 'Create a calendar event from this note', send: true },
      { label: '✅ To tasks', prompt: 'Create tasks from the action items in this note', send: true },
      { label: '📝 Summarize', prompt: 'Summarize this note', send: true },
    ] }, '*');
  } catch (_) {}
  $('empty').style.display = 'none';
  $('editor').style.display = 'flex';
  $('e-title').value = n.title || '';
  $('e-tags').value = n.tags || '';
  $('e-body').value = n.body || '';
  closeResult();
  setMode('edit');
  applyNoteChrome(n);
  $('app').classList.add('editing');
  render();
}

// Configure the editor toolbar + read-only state for the selected note.
function applyNoteChrome(n) {
  const isGroup = n.scope === 'group';
  const readOnly = isGroup && !n.canEdit;
  // Read-only shared notes: lock the fields and hide the mutating controls.
  for (const id of ['e-title', 'e-tags', 'e-body']) $(id).readOnly = readOnly;
  $('save-btn').style.display = readOnly ? 'none' : '';
  $('del-btn').style.display = readOnly ? 'none' : '';
  $('del-btn').title = isGroup ? 'Remove from group' : 'Delete';
  document.querySelector('.ai-bar').style.display = readOnly ? 'none' : '';
  // RAG upsert — group admins / personal scope / global admin only.
  $('kn-btn').style.display = CAPS.canManageRag ? '' : 'none';
  // Share — only on a personal note, when the user has a group. On a group note,
  // "unshare" is the 🗑 button (owner/admin). Toggle label if already shared.
  const shareBtn = $('share-btn');
  if (CAPS.hasGroup && n.scope === 'personal') {
    const already = notes.find(x => x.scope === 'group' && String(x.originId) === String(n.id));
    shareBtn.style.display = '';
    shareBtn.textContent = already ? '📤 Shared ✓' : '📤 Share';
    shareBtn.title = already
      ? 'Update the shared copy (to unshare, open the shared note and remove it)'
      : 'Share this note with your group';
  } else {
    shareBtn.style.display = 'none';
  }
}

// Publish (or update) the current personal note to the group. Idempotent: it
// creates the group copy the first time and refreshes it on subsequent clicks.
// Unsharing is done by removing the shared copy (🗑 on the shared note).
async function toggleShare() {
  const n = currentNote();
  if (!n || n.scope !== 'personal') return;
  const btn = $('share-btn');
  await saveNote(); // push latest edits before sharing
  try {
    const r = await fetch(`/api/notes/share?id=${encodeURIComponent(n.id)}`, { method: 'POST' });
    if (!r.ok) throw new Error(await r.text());
    await load();
    if (currentNote()) applyNoteChrome(currentNote());
    btn.title = 'Shared with your group ✓';
  } catch (e) {
    btn.title = 'Share failed: ' + e.message;
  }
}

async function newNote() {
  const { id } = await api(`?session=${encodeURIComponent(session)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: 'Untitled', body: '', tags: '' })
  });
  await load();
  select(id);
  $('e-title').focus(); $('e-title').select();
}

async function saveNote() {
  if (!selectedId) return;
  const n = currentNote();
  if (n && n.scope === 'group' && !n.canEdit) return; // read-only shared note
  const body = { id: selectedId, title: $('e-title').value, body: $('e-body').value, tags: $('e-tags').value };
  if (n && n.scope === 'group') body.scope = 'group';
  await api(`?session=${encodeURIComponent(session)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  await load();
}

async function deleteNote() {
  if (!selectedId) return;
  const n = currentNote();
  const isGroup = n && n.scope === 'group';
  if (!await PrismModal.confirm(isGroup ? 'Remove this note from the group?' : 'Delete this note?', { danger: true, okLabel: isGroup ? 'Remove' : 'Delete' })) return;
  const q = isGroup ? '&scope=group' : '';
  await fetch(`/api/notes?session=${encodeURIComponent(session)}&id=${selectedId}${q}`, { method: 'DELETE' });
  selectedId = null;
  closeEditor();
  await load();
}

function closeEditor() {
  $('editor').style.display = 'none';
  $('empty').style.display = 'flex';
  $('app').classList.remove('editing');
}

// ── AI (one-shot via /api/ai/assist) ──────────────────────────────────────────
function aiTarget() {
  const ta = $('e-body'), s = ta.selectionStart, e = ta.selectionEnd;
  if (s !== e) return { text: ta.value.slice(s, e), start: s, end: e, isSel: true };
  return { text: ta.value, start: 0, end: ta.value.length, isSel: false };
}
async function assist(task, text, instruction) {
  const r = await fetch('/api/ai/assist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ task, text, instruction: instruction || '' }) });
  if (!r.ok) throw new Error(await r.text());
  return (await r.json()).result || '';
}
async function runAI(task, instruction, label) {
  const tgt = aiTarget();
  if (!tgt.text.trim()) return;
  lastTarget = tgt;
  $('ar-title').textContent = '✨ ' + (label || 'Result') + (tgt.isSel ? ' (selection)' : ' (whole note)');
  $('ar-text').textContent = 'Working…';
  $('ai-result').classList.add('open');
  document.querySelectorAll('.ai-btn').forEach(b => b.disabled = true);
  try { $('ar-text').textContent = await assist(task, tgt.text, instruction); }
  catch (e) { $('ar-text').textContent = 'Failed: ' + e.message; }
  finally { document.querySelectorAll('.ai-btn').forEach(b => b.disabled = false); }
}
function applyResult(how) {
  const ta = $('e-body'), text = $('ar-text').textContent;
  if (how === 'copy') { navigator.clipboard?.writeText(text); return; }
  const t = lastTarget || { start: ta.value.length, end: ta.value.length };
  if (how === 'replace') ta.value = ta.value.slice(0, t.start) + text + ta.value.slice(t.end);
  else { const at = ta.selectionStart != null ? ta.selectionStart : ta.value.length; ta.value = ta.value.slice(0, at) + text + ta.value.slice(at); }
  if (mode !== 'edit') updatePreview();
  closeResult(); saveNote();
}
function closeResult() { $('ai-result').classList.remove('open'); }
function customAI() { $('p-instr').value = ''; $('overlay').classList.add('open'); setTimeout(() => $('p-instr').focus(), 30); }
function closePrompt() { $('overlay').classList.remove('open'); }
function runCustom() { const i = $('p-instr').value.trim(); closePrompt(); if (i) runAI('custom', i, 'Custom'); }

document.querySelectorAll('.ai-btn[data-task]').forEach(b => b.addEventListener('click', () => runAI(b.dataset.task, '', b.textContent)));
$('p-instr').addEventListener('keydown', e => { if (e.key === 'Enter') runCustom(); });
function updateScope() { const ta = $('e-body'); $('ai-scope').textContent = ta.selectionStart !== ta.selectionEnd ? 'AI → selection' : 'AI → whole note'; }
['select', 'keyup', 'mouseup'].forEach(ev => $('e-body').addEventListener(ev, updateScope));
$('e-body').addEventListener('input', () => { if (mode !== 'edit') updatePreview(); });

$('search').addEventListener('input', e => { filter = e.target.value; render(); });
['e-title', 'e-tags', 'e-body'].forEach(id => $(id).addEventListener('blur', () => { if (selectedId) saveNote(); }));

// Reload when the agent changes notes via chat.
addEventListener('message', e => { if (e.data && e.data.type === 'data-changed') load(true); });

loadCaps().then(load);
</script>
