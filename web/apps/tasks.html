<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<link rel="stylesheet" href="/widget-base.css">
<script src="/theme.js"></script>
<script>
  addEventListener('message', e => {
    if (e.data && e.data.type === 'prism-theme' && e.data.vars) {
      const r = document.documentElement.style;
      for (const k in e.data.vars) r.setProperty(k, e.data.vars[k]);
    }
  });
</script>
<style>
  html, body { height: 100%; }
  body { padding: 0; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
  .head h1 { font-size: 16px; color: var(--text); flex: 1; }
  .head .sub { font-size: 12px; color: var(--text2); }
  .list { flex: 1; overflow-y: auto; padding: 14px 18px; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); align-content: start; }

  .job { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, opacity .15s; }
  .job.off { opacity: .55; }
  .job-top { display: flex; align-items: center; gap: 10px; }
  .job-name { font-weight: 600; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .job-when { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--accent); background: var(--accent-dim); padding: 3px 9px; border-radius: 999px; align-self: flex-start; }
  .job-cmd { font-family: var(--mono); font-size: 11px; color: var(--text2); background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; word-break: break-all; max-height: 64px; overflow: auto; }
  .job-foot { display: flex; align-items: center; gap: 10px; }
  .job-status { font-size: 11px; color: var(--text2); flex: 1; }
  .job-del { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; }
  .job-del:hover { color: var(--red); background: var(--bg3); }

  /* toggle switch */
  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--bg4); border-radius: 999px; cursor: pointer; transition: background .15s; }
  .slider::before { content: ''; position: absolute; height: 16px; width: 16px; left: 3px; top: 3px; background: var(--text2); border-radius: 50%; transition: transform .15s, background .15s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(16px); background: #fff; }

  .empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text3); padding: 40px; text-align: center; }
  .empty .big { font-size: 40px; opacity: .3; }
</style>
</head>
<body>
  <div class="app">
    <div class="head">
      <h1>Scheduled tasks</h1>
      <span class="sub" id="count"></span>
    </div>
    <div class="list" id="list"></div>
  </div>

<script>
const api = (opts) => fetch('/api/cron', opts);
let jobs = [];

// Friendly-ish rendering of a cron schedule.
function humanize(sch) {
  const map = { '@hourly': 'Every hour', '@daily': 'Every day', '@weekly': 'Every week', '@monthly': 'Every month', '@reboot': 'On start', '@yearly': 'Every year' };
  if (map[sch]) return map[sch];
  const f = sch.split(/\s+/);
  if (f.length === 5) {
    const [m, h, dom, mon, dow] = f;
    if (dom === '*' && mon === '*' && dow === '*' && h !== '*' && m !== '*') return `Daily at ${pad(h)}:${pad(m)}`;
    if (m.startsWith('*/')) return `Every ${m.slice(2)} min`;
    if (h.startsWith('*/')) return `Every ${h.slice(2)} h`;
  }
  return sch;
}
function pad(x) { return String(x).padStart(2, '0'); }

async function load() {
  try {
    const data = await api().then(r => r.json());
    jobs = data.jobs || [];
  } catch { jobs = []; }
  render();
}

function render() {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const on = jobs.filter(j => j.enabled).length;
  count.textContent = jobs.length ? `${on} active · ${jobs.length} total` : '';
  list.innerHTML = '';
  if (!jobs.length) {
    list.innerHTML = '<div class="empty"><div class="big">⏱</div><div>No scheduled tasks yet</div><div style="font-size:12px">Ask the agent to schedule something — it appears here.</div></div>';
    return;
  }
  for (const j of jobs) {
    const card = document.createElement('div');
    card.className = 'job' + (j.enabled ? '' : ' off');
    card.innerHTML = `
      <div class="job-top">
        <span class="job-name">${esc(j.name)}</span>
        <label class="switch"><input type="checkbox" ${j.enabled ? 'checked' : ''}><span class="slider"></span></label>
      </div>
      <span class="job-when">⏱ ${esc(humanize(j.schedule))}</span>
      <div class="job-cmd">${esc(j.command)}</div>
      <div class="job-foot">
        <span class="job-status">${j.enabled ? 'Active' : 'Paused'}</span>
        <button class="job-del" title="Delete">🗑 Delete</button>
      </div>`;
    card.querySelector('input').addEventListener('change', e => toggle(j.name, e.target.checked));
    card.querySelector('.job-del').addEventListener('click', () => remove(j.name));
    list.appendChild(card);
  }
}

async function toggle(name, enabled) {
  await api({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, enabled }) });
  load();
}
async function remove(name) {
  if (!confirm(`Delete scheduled task "${name}"?`)) return;
  await fetch('/api/cron?name=' + encodeURIComponent(name), { method: 'DELETE' });
  load();
}
function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

load();
setInterval(load, 15000);
</script>
</body>
</html>
