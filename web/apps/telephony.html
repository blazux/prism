<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telephony — Prism</title><link rel="stylesheet" href="/widget-base.css"><script src="/theme.js"></script><link rel="stylesheet" href="/apps/telephony.css"></head>
<body>
<header><strong id="appTitle">Telephony</strong><select id="groups" hidden aria-label="Group"></select></header>
<nav><button id="logsTab" class="active"></button><button id="outboundTab"></button><button id="chatTab"></button><button id="contextButton" hidden></button></nav>
<div id="error" role="status"></div>
<section id="contextPanel" hidden><p id="contextStats"></p><details><summary id="summaryLabel"></summary><p id="contextBrief"></p></details><button id="compact"></button><p id="contextHelp" class="muted"></p></section>
<main>
<section id="logs"><form id="filters"><input id="number" type="tel"><input id="query"><input id="since" type="datetime-local" aria-label="Since"><input id="until" type="datetime-local" aria-label="Until"><select id="direction"><option value=""></option><option value="inbound"></option><option value="outbound"></option></select><button id="filterButton"></button></form><div class="traffic-summary"><p id="total" class="muted"></p><button id="refreshLogs" type="button"></button><time id="updated" class="muted"></time></div><table><thead><tr id="columns"></tr></thead><tbody id="calls"></tbody></table><div class="bar"><button id="previous"></button><button id="next"></button></div></section>
<section id="outbound" hidden>
<h2 id="newCall"></h2>
<form id="callForm">
<label><span id="phoneLabel"></span><input id="callPhone" type="tel" required maxlength="80" autocomplete="tel"></label>
<label><span id="contactLabel"></span><input id="callContact" maxlength="200" autocomplete="name"></label>
<label class="mission"><span id="missionLabel"></span><textarea id="callMission" required maxlength="16000" rows="3"></textarea></label>
<label><span id="whenLabel"></span><input id="callAt" type="datetime-local" required><small id="callTimezone" class="muted"></small></label>
<label><span id="attemptsLabel"></span><input id="callAttempts" type="number" min="1" max="10" value="3" required></label>
<label class="call-now"><input id="callNow" type="checkbox"><span id="nowLabel"></span></label>
<button id="scheduleCall" type="submit"></button><span id="callFeedback" role="status" class="muted"></span>
</form>
<div class="queue-heading"><h2 id="myCalls"></h2><button id="refreshOutbound" type="button"></button></div>
<div id="outboundItems"></div><div class="bar"><button id="previousCalls"></button><span id="outboundTotal" class="muted"></span><button id="nextCalls"></button></div>
</section>
<section id="chat" hidden><div class="bar"><button id="earlier"></button><span id="chatHint" class="muted"></span></div><div id="messages" aria-live="polite"></div><div id="activity" role="status"></div><form id="compose"><input id="message" maxlength="16000" autocomplete="off" aria-label="Message"><button id="send"></button></form></section>
</main>
<script>
const $=id=>document.getElementById(id),standalone=new URLSearchParams(location.search).get('mode')==='vox',fr=navigator.language.startsWith('fr');
window.addEventListener('message',e=>{
  if(e.source!==parent||e.data?.type!=='prism-theme'||!e.data.vars)return;
  for(const [key,value] of Object.entries(e.data.vars))document.documentElement.style.setProperty(key,value);
});
window.addEventListener('storage',e=>{if(e.key===PrismTheme.KEYS.FONT)PrismTheme.applyFont();});
$('appTitle').textContent=fr?'Téléphonie':'Telephony';document.title=$('appTitle').textContent+' — Prism';
const t=fr?{chat:'Supervision',logs:'Appels',context:'Contexte de l’agent',settings:'Paramètres',access:'Accès',accessHelp:'Les membres des groupes cochés ont accès à l’app Téléphonie. Les appels personnels restent privés.',save:'Enregistrer',summary:'Résumé conservé',compact:'Alléger le contexte',contextHelp:'Les anciens échanges sont résumés. La conversation et les appels d’outils restent dans l’historique.',earlier:'Messages précédents',chatHint:'Posez une question sur l’activité du standard.',placeholder:'Combien d’appels sortants cette semaine ?',send:'Envoyer',thinking:'Consultation en cours…',number:'Numéro',query:'Rechercher dans les appels',all:'Toutes les directions',inbound:'Entrants',outbound:'Sortants',filter:'Rechercher',previous:'Précédents',next:'Suivants',columns:['Numéro','Direction','Date','Durée','État'],total:'appels correspondants',transcript:'Transcription',tools:'Appels d’outils',more:'Suite',error:'La requête a échoué. Réessayez.',disconnected:'PrismVox n’est pas connecté ou l’app Téléphonie ne vous est pas accessible.',noSummary:'Aucun résumé pour le moment.',archive:'messages archivés',active:'messages actifs',chars:'caractères',noCalls:'Aucun appel correspondant.',empty:'Vous pouvez interroger l’agent sur ses appels.',standard:'Standard',adminArchive:'Archives administrateur',owner:'Mon activité',args:'Paramètres',result:'Résultat',since:'Du',until:'Au',end:'Fin d’appel',failed:'Échec',noResult:'Résultat non reçu',returned:'Résultat reçu',truncated:'tronqué'}:{chat:'Supervision',logs:'Calls',context:'Agent context',settings:'Settings',access:'Access',accessHelp:'Members of the selected groups can access the Telephony app. Personal calls remain private.',save:'Save',summary:'Retained summary',compact:'Lighten context',contextHelp:'Older exchanges are summarized. The conversation and tool calls remain in the archive.',earlier:'Earlier messages',chatHint:'Ask about the reception agent’s activity.',placeholder:'How many outbound calls this week?',send:'Send',thinking:'Consulting the archive…',number:'Number',query:'Search calls',all:'All directions',inbound:'Inbound',outbound:'Outbound',filter:'Search',previous:'Previous',next:'Next',columns:['Number','Direction','Date','Duration','Status'],total:'matching calls',transcript:'Transcript',tools:'Tool calls',more:'Continue',error:'The request failed. Please retry.',disconnected:'PrismVox is disconnected or the Telephony app is unavailable to you.',noSummary:'No summary yet.',archive:'archived messages',active:'active messages',chars:'characters',noCalls:'No matching calls.',empty:'Ask the agent about its calls.',standard:'Reception',adminArchive:'Administrator archive',owner:'My activity',args:'Arguments',result:'Result',since:'From',until:'Until',end:'Call outcome',failed:'Failed',noResult:'Result not received',returned:'Result returned',truncated:'truncated'};
Object.assign(t,fr?{outboundCalls:'Appels sortants',finished:'Terminé',calling:'En cours',refresh:'Actualiser',newCall:'Programmer un appel',phone:'Numéro de téléphone',contact:'Nom du contact (facultatif)',mission:'Mission de l’agent',when:'Date et heure',now:'Appeler dès que possible',attempts:'Nombre maximal de tentatives',schedule:'Programmer l’appel',myCalls:'Vos appels sortants',scheduled:'Programmé pour',status:'État',actions:'Actions',cancel:'Annuler',retry:'Relancer maintenant',pending:'En attente',done:'Terminé',no_answer:'Sans réponse',failed:'Échec',cancelled:'Annulé',emptyQueue:'Aucun appel sortant.',scheduledOK:'Appel programmé.',invalidTime:'Choisissez une date et une heure à venir.',previousCalls:'Précédents',nextCalls:'Suivants'}:{outboundCalls:'Outbound calls',finished:'Finished',calling:'In progress',refresh:'Refresh',newCall:'Schedule a call',phone:'Phone number',contact:'Contact name (optional)',mission:'Agent mission',when:'Date and time',now:'Call as soon as possible',attempts:'Maximum attempts',schedule:'Schedule call',myCalls:'Your outbound calls',scheduled:'Scheduled for',status:'Status',actions:'Actions',cancel:'Cancel',retry:'Retry now',pending:'Pending',done:'Finished',no_answer:'No answer',failed:'Failed',cancelled:'Cancelled',emptyQueue:'No outbound calls.',scheduledOK:'Call scheduled.',invalidTime:'Choose a date and time in the future.',previousCalls:'Previous',nextCalls:'Next'});
document.documentElement.lang=fr?'fr':'en';for(const id of ['number','query','direction','since','until']){$(id).setAttribute('aria-label',t[id]||t.all)}for(const id of ['since','until']){const input=$(id),label=document.createElement('label');label.className='muted';label.append(document.createTextNode(t[id]+' '));input.before(label);label.append(input)}for(const[id,key]of[['chatTab','chat'],['logsTab','logs'],['outboundTab','outboundCalls'],['contextButton','context'],['summaryLabel','summary'],['compact','compact'],['contextHelp','contextHelp'],['earlier','earlier'],['chatHint','chatHint'],['send','send'],['filterButton','filter'],['previous','previous'],['next','next']])$(id).textContent=t[key];$('message').placeholder=t.placeholder;$('number').placeholder=t.number;$('query').placeholder=t.query;[t.all,t.inbound,t.outbound].forEach((v,i)=>$('direction').options[i].textContent=v);for(const label of t.columns){const th=document.createElement('th');th.textContent=label;$('columns').append(th)}
let session=standalone?(localStorage.getItem('vox-supervision-session')||crypto.randomUUID()):'owner',group='',epoch=0,oldest=0,messages=new Map(),offset=0,nextOffset=null,previousOffsets=[],busy=false;
if(standalone)localStorage.setItem('vox-supervision-session',session);
function error(s=''){$('error').textContent=s}
async function api(path,method='GET',body,params={}){const q=new URLSearchParams(params);q.set('session_id',session);if(group)q.set('group',group);const root=standalone?'/api/':'/api/vox-workspace/';const mapped=standalone&&['conversation','context'].includes(path)?'supervision/'+path:path;const r=await fetch(root+mapped+'?'+q,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify({...body,session_id:session,timezone:Intl.DateTimeFormat().resolvedOptions().timeZone}):undefined});if(!r.ok)throw Error(t.error+' ('+r.status+')');return r.json()}
function showTools(el,traces){for(const trace of traces||[]){const d=document.createElement('details');d.className='trace';const head=document.createElement('summary');head.textContent=trace.name+(trace.arguments?.action?' · '+trace.arguments.action:'')+' · '+(trace.is_error?t.failed:trace.outcome==='started'?t.noResult:t.returned);const pre=document.createElement('pre');pre.textContent=t.args+'\n'+JSON.stringify(trace.arguments||{},null,2)+'\n\n'+t.result+(trace.result_truncated?' ('+t.truncated+')':'')+'\n'+String(trace.result??'');d.append(head,pre);el.append(d)}}
function addMessage(m,prepend=false){if(messages.has(m.id))return;const el=document.createElement('article');el.className='msg '+m.role;const who=document.createElement('div');who.className='who';who.textContent=(m.role==='assistant'?'PrismVox':'●')+(m.created_at?' · '+new Date(m.created_at).toLocaleString():'');const text=document.createElement('div');text.className='text';text.textContent=m.content;el.append(who,text);showTools(el,m.tools);messages.set(m.id,el);if(prepend)$('messages').prepend(el);else $('messages').append(el);if(typeof m.id==='number'&&(!oldest||m.id<oldest))oldest=m.id}
async function history(earlier=false){const gen=epoch,log=$('messages'),height=log.scrollHeight;try{const d=await api('conversation','GET',null,{before:earlier?oldest:0});if(gen!==epoch)return;const rows=d.items||[],hasNew=rows.some(m=>!messages.has(m.id));if(earlier)for(const m of [...rows].reverse())addMessage(m,true);else for(const m of rows)addMessage(m);$('earlier').disabled=!d.has_more;if(earlier)log.scrollTop+=log.scrollHeight-height;else if(hasNew)log.scrollTop=log.scrollHeight}catch(e){error(e.message)}}
async function context(force=false){const gen=epoch;$('compact').disabled=true;try{const d=await api('context',force?'POST':'GET',force?{message:''}:undefined);if(gen!==epoch)return;$('contextStats').textContent=d.archivedMessages+' '+t.archive+' · '+d.activeMessages+' '+t.active+' · '+d.activeChars+' '+t.chars;$('contextBrief').textContent=d.summary||t.noSummary;error()}catch(e){error(e.message)}finally{$('compact').disabled=busy}}
$('compose').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text||busy)return;const gen=epoch;busy=true;$('send').disabled=true;$('message').disabled=true;$('groups').disabled=true;$('compact').disabled=true;error();$('message').value='';addMessage({id:'pending',role:'user',content:text});$('activity').textContent=t.thinking;$('messages').scrollTop=$('messages').scrollHeight;try{await api('chat','POST',{message:text});if(gen===epoch){messages.get('pending')?.remove();messages.delete('pending');await history();if(!$('contextPanel').hidden)await context()}}catch(e){error(e.message);$('message').value=text;messages.get('pending')?.remove();messages.delete('pending')}finally{busy=false;$('activity').textContent='';$('send').disabled=false;$('message').disabled=false;$('groups').disabled=false;$('compact').disabled=false;$('message').focus()}};
function filters(){const p={limit:25,offset,number:$('number').value,query:$('query').value,direction:$('direction').value};for(const key of ['since','until'])if($(key).value)p[key]=new Date($(key).value).toISOString();return p}
async function logs(){const gen=epoch;try{const d=await api('history','GET',null,filters());if(gen!==epoch)return;$('calls').replaceChildren();$('total').textContent=d.total+' '+t.total;nextOffset=d.next_offset;$('updated').textContent=new Date().toLocaleTimeString();$('previous').disabled=offset===0;$('next').disabled=nextOffset==null;for(const c of d.items||[]){const tr=document.createElement('tr');tr.className='call';for(const text of [c.caller_number||'—',t[c.direction]||c.direction,new Date(c.started_at).toLocaleString(),(c.duration_secs||0)+'s',c.ended_at?(c.end_reason||t.finished):t.calling]){const td=document.createElement('td');if(tr.children.length===0){const button=document.createElement('button');button.textContent=text;td.append(button)}else td.textContent=text;tr.append(td)}const detail=document.createElement('tr');detail.hidden=true;const cell=document.createElement('td');cell.colSpan=5;detail.append(cell);let loaded=false;tr.onclick=()=>{detail.hidden=!detail.hidden;if(!loaded&&!detail.hidden){loaded=true;const block=document.createElement('div');block.className='record';for(const value of [c.summary,c.message])if(value){const p=document.createElement('p');p.textContent=value;block.append(p)}for(const section of ['turns','tools']){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=section==='turns'?t.transcript:t.tools;const content=document.createElement('div'),more=document.createElement('button');more.textContent=t.more;d.append(s,content,more);block.append(d);let next=0,started=false;const load=async()=>{more.disabled=true;try{const page=await api('history','GET',null,{id:c.id,section,offset:next,limit:25});for(const r of page.items){const pre=document.createElement('pre');if(section==='tools'&&!r.record_text){showTools(content,[{name:r.tool||r.name||'tool',arguments:r.args||r.input||{},result:r.result??r.output??'',is_error:r.is_error||r.outcome==='failed',outcome:r.outcome,result_truncated:r.result_truncated}])}else{pre.textContent=section==='turns'&&!r.record_text?(r.role+': '+r.text):JSON.stringify(r,null,2);content.append(pre)}if(r.next_text_offset!=null){const button=document.createElement('button');button.textContent=t.more;let charOffset=r.next_text_offset;button.onclick=async()=>{try{const p=await api('history','GET',null,{id:c.id,section,offset:page.offset+page.items.indexOf(r),limit:1,text_offset:charOffset});const item=p.items[0];pre.textContent+=item.record_text||'';charOffset=item.next_text_offset;button.hidden=charOffset==null}catch(e){error(e.message)}};content.append(button)}}next=page.next_offset;more.hidden=next==null}catch(e){error(e.message)}finally{more.disabled=false}};more.onclick=load;d.ontoggle=()=>{if(d.open&&!started){started=true;load()}}}cell.append(block)}};$('calls').append(tr,detail)}}catch(e){error(e.message)}}
$('filters').onsubmit=e=>{e.preventDefault();offset=0;previousOffsets=[];logs()};$('previous').onclick=()=>{offset=previousOffsets.pop()||0;logs()};$('next').onclick=()=>{previousOffsets.push(offset);offset=nextOffset;logs()};$('earlier').onclick=()=>history(true);$('contextButton').onclick=()=>{$('contextPanel').hidden=!$('contextPanel').hidden;if(!$('contextPanel').hidden)context()};$('compact').onclick=()=>context(true);
function tab(name){
  if(!['chat','logs','outbound'].includes(name))name='logs';
  for(const [id,page] of [['chat','chat'],['logs','logs'],['outbound','outbound']])$(id).hidden=name!==page;
  $('groups').hidden=name==='outbound'||$('groups').options.length<2;
  $('contextButton').hidden=name!=='chat';if(name!=='chat')$('contextPanel').hidden=true;
  for(const [id,page] of [['chatTab','chat'],['logsTab','logs'],['outboundTab','outbound']])$(id).classList.toggle('active',name===page);
  if(name==='logs')logs();if(name==='outbound')outbound();if(name==='chat')history();
}
$('chatTab').onclick=()=>tab('chat');$('logsTab').onclick=()=>tab('logs');$('outboundTab').onclick=()=>tab('outbound');
$('refreshLogs').onclick=logs;
setInterval(()=>{if(!document.hidden){if(!$('logs').hidden)logs();if(!$('outbound').hidden)outbound();}},10000);
$('groups').onchange=()=>{group=$('groups').value;epoch++;offset=0;previousOffsets=[];$('calls').replaceChildren();messages.clear();oldest=0;$('messages').replaceChildren();$('contextPanel').hidden=true;history();if(!$('logs').hidden)logs()};
async function init(){try{const view=new URLSearchParams(location.search).get('view');if(view){document.querySelector('header').hidden=true;$('chatTab').hidden=true;$('logsTab').hidden=true;$('outboundTab').hidden=true;if(view==='logs'){document.querySelector('nav').hidden=true;tab('logs')}}if(!standalone){const r=await fetch('/api/vox-workspace');if(!r.ok)throw Error(t.disconnected);const d=await r.json();if(!d.available)throw Error(t.disconnected);if(d.multiUser){for(const g of d.groups||[]){const o=document.createElement('option');o.value=g.id;o.textContent=g.name;$('groups').append(o)}if(!$('groups').options.length){const o=document.createElement('option');o.value='0';o.textContent=t.standard;$('groups').append(o)}$('groups').hidden=false;group=$('groups').value;}if(d.admin){if(!$('groups').options.length){const o=document.createElement('option');o.value='0';o.textContent=t.owner;$('groups').append(o)}const o=document.createElement('option');o.value='admin';o.textContent=t.adminArchive;$('groups').append(o);$('groups').hidden=false;if(!group)group=$('groups').value;}}const requestedGroup=new URLSearchParams(location.search).get('group');if([...$('groups').options].some(o=>o.value===requestedGroup)){$('groups').value=requestedGroup;group=requestedGroup}const requestedTab=new URLSearchParams(location.search).get('tab');if(requestedTab==='settings'){location.replace('/apps/telephony/settings');return}tab(view==='chat'?'chat':view==='logs'?'logs':requestedTab||'logs')}catch(e){error(e.message);$('send').disabled=true;$('scheduleCall').disabled=true;$('outboundTab').disabled=true}}
</script><script src="/apps/telephony-calls.js"></script><script>init();
// Refresh shared replies while visible; DOM deduplication keeps earlier pages.
setInterval(()=>{if(!document.hidden&&!busy&&!$('chat').hidden)history()},10000);
</script></body></html>
