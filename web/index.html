<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
</head>
<body>
  <!-- Per-theme animated background (see #bg-fx rules in style.css) -->
  <div id="bg-fx"></div>
  <div id="app">

    <!-- Top bar -->
    <header id="dash-header">
      <div class="header-left">
        <span class="logo">
          <svg width="44" height="22" viewBox="0 0 44 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Prism triangle -->
            <polygon points="22,1 9,21 35,21" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <!-- Incoming white ray -->
            <line x1="0" y1="11" x2="15.5" y2="11" stroke="currentColor" stroke-width="1.2"/>
            <!-- Dispersed rays -->
            <line x1="28.5" y1="11" x2="44" y2="5"   stroke="#a855f7" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="7.4" stroke="#3b82f6" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="9.8" stroke="#22c55e" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="12.2" stroke="#eab308" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="14.6" stroke="#f97316" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="17"  stroke="#ef4444" stroke-width="1.2"/>
          </svg>
          PRISM
        </span>
        <div id="container-badge" class="badge badge-unknown" title="Container status"></div>
        <span id="view-title"></span>
      </div>
      <div class="header-right">
        <a id="settings-link" href="/settings.html" title="Settings" style="display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border2);color:var(--text3);font-size:11.5px;padding:4px 10px;border-radius:var(--radius);text-decoration:none;transition:color .15s,border-color .15s" onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--accent)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border2)'">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </a>

        <select id="theme-select" title="Theme"></select>
        <select id="model-select" onchange="setModel(this.value)" title="AI Model"></select>
        <button id="notif-btn" onclick="toggleNotifPanel()" title="Notifications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span id="notif-badge" style="display:none"></span>
        </button>
        <div id="notif-panel" class="notif-panel" style="display:none">
          <div class="notif-panel-header">
            <span>Notifications</span>
            <button onclick="markAllNotifRead()" title="Mark all as read">✓ Read</button>
          </div>
          <div id="notif-list"></div>
        </div>
      </div>
    </header>

    <!-- Body: left rail + main pane -->
    <div id="body">

      <!-- Left rail: apps (top) + boards (bottom). Expands on hover. -->
      <nav id="rail">
        <div id="rail-inner">
          <div class="rail-section rail-apps">
            <button class="rail-item" data-app="email" title="Email">
              <span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg></span><span class="rail-label">Email</span></button>
            <button class="rail-item" data-app="notes" title="Notes">
              <span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/><path d="M8 13h8M8 17h6"/></svg></span><span class="rail-label">Notes</span></button>
            <button class="rail-item" data-app="tasks" title="Tasks">
              <span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></span><span class="rail-label">Tasks</span></button>
            <button class="rail-item" data-app="calendar" title="Calendar">
              <span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span><span class="rail-label">Calendar</span></button>
          </div>
          <div class="rail-sep"></div>
          <div class="rail-section rail-boards" id="rail-boards"></div>
          <div class="rail-spacer"></div>
          <button class="rail-item rail-new" onclick="promptNewSession()" title="New workspace">
            <span class="rail-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span><span class="rail-label">New workspace</span></button>
        </div>
      </nav>

      <!-- Main pane: board canvas (widgets) or a full-pane app iframe -->
      <main id="main">
        <!-- Widget windows mount directly into #dashboard (free-floating) -->
        <div id="dashboard">
          <div id="empty-state">
            <div class="empty-icon">⊞</div>
            <div class="empty-title">No widgets yet</div>
            <div class="empty-hint">Open the chat and ask the AI to build one</div>
            <div class="empty-examples">
              <span data-prompt="Add a weather widget for Paris">🌤 Weather</span>
              <span data-prompt="Show live stock prices for AAPL, MSFT and NVDA">📈 Stocks</span>
              <span data-prompt="Create a traffic widget to know if I'll be late to work">🚗 Traffic</span>
              <span data-prompt="Add a world clock widget showing Paris, New York and Tokyo">🕐 Clock</span>
            </div>
          </div>
        </div>
        <!-- Full-pane app view (Email/Notes/Tasks/Calendar) -->
        <iframe id="app-frame" style="display:none"></iframe>
        <!-- Widget dock (taskbar): minimize/restore/delete every widget -->
        <div id="widget-dock" style="display:none"></div>
      </main>

      <!-- Chat: docked side panel (sibling of #main inside #body) -->
      <div id="chat-drawer">
        <div id="chat-resize-handle"></div>
        <div id="chat-header">
          <span class="chat-title" id="chat-agent">Assistant</span>
          <div class="chat-header-actions">
            <button onclick="resetChat()" title="New conversation">New chat</button>
            <button class="drawer-close" onclick="toggleChat()" title="Close">✕</button>
          </div>
        </div>
        <div id="chat-context-bar" style="display:none"></div>
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <div id="chat-suggestions" style="display:none"></div>
          <div id="image-previews" style="display:none"></div>
          <div class="chat-input-row">
            <label id="attach-btn" title="Attach a file — images, PDF, DOCX, TXT, CSV… (or paste image with Ctrl+V)">
              <input type="file" accept="image/*,.pdf,.docx,.txt,.csv,.md,.json,.tsv" multiple style="display:none"
                onchange="Array.from(this.files).forEach(addAttachment); this.value=''">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
              </svg>
            </label>
            <button id="emoji-btn" title="Insert emoji" onclick="toggleEmojiPicker()">😊</button>
            <textarea
              id="chat-input"
              placeholder="Ask anything… Ctrl+V to paste an image"
              onkeydown="handleChatKey(event)"
              rows="1"
            ></textarea>
            <button id="send-btn" onclick="sendChat()">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                <path d="M1 8L15 1L8 15L7 9L1 8Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- File editor panel -->
    <div id="editor-overlay" onclick="closeEditor()"></div>
    <div id="editor-panel">
      <div id="editor-header">
        <span id="editor-filename"></span>
        <div class="editor-header-actions">
          <span id="editor-status"></span>
          <button id="editor-save-btn" onclick="editorSave()">Save</button>
          <button class="drawer-close" onclick="closeEditor()">✕</button>
        </div>
      </div>
      <div id="editor-codemirror"></div>
    </div>

    <!-- Secret input dialog -->
    <div id="secret-overlay" onclick="cancelSecretDialog()"></div>
    <div id="secret-dialog">
      <div class="secret-dialog-header">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Secret requis</span>
      </div>
      <div class="secret-dialog-desc" id="secret-dialog-desc"></div>
      <input type="password" id="secret-dialog-input" placeholder="Valeur secrète…" autocomplete="new-password" onkeydown="handleSecretKey(event)">
      <div class="secret-dialog-actions">
        <button class="secret-btn-cancel" onclick="cancelSecretDialog()">Annuler</button>
        <button class="secret-btn-submit" onclick="submitSecretDialog()">Confirmer</button>
      </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Login overlay -->
    <div id="login-overlay" style="display:none">
      <div id="login-box">
        <div class="login-logo">
          <svg width="36" height="18" viewBox="0 0 44 22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <polygon points="22,1 9,21 35,21" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <line x1="0" y1="11" x2="15.5" y2="11" stroke="currentColor" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="5"   stroke="#a855f7" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="7.4" stroke="#3b82f6" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="9.8" stroke="#22c55e" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="12.2" stroke="#eab308" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="14.6" stroke="#f97316" stroke-width="1.2"/>
            <line x1="28.5" y1="11" x2="44" y2="17"  stroke="#ef4444" stroke-width="1.2"/>
          </svg>
          PRISM
        </div>
        <input type="password" id="login-input" placeholder="Access token" autocomplete="current-password"
          onkeydown="if(event.key==='Enter')submitLogin()">
        <div id="login-error">Invalid token</div>
        <button id="login-btn" onclick="submitLogin()">Sign in</button>
      </div>
    </div>

    <!-- Floating chat button -->
    <button id="chat-fab" onclick="toggleChat()" title="Chat with AI">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <!-- Theme + window manager must load (classic scripts) before the app module -->
  <script src="/theme.js"></script>
  <script src="/windows.js"></script>
  <script src="/bgfx.js"></script>
  <!-- CodeMirror -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/go/go.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/shell/shell.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/toml/toml.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
