<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — PRISM</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/documents.css">
<script src="/theme.js"></script>
<script src="/modal.js"></script>
<script src="/documents.js"></script>
<style>
html, body { height:100%; overflow:hidden; margin:0; }
#rag-app { display:flex; flex-direction:column; height:100vh; }
#rag-main { display:flex; flex:1; min-height:0; }
#toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg3); border:1px solid var(--border2); color:var(--text); padding:10px 18px; border-radius:8px; font-size:12.5px; z-index:200; opacity:0; pointer-events:none; transition:opacity .15s; max-width:calc(100vw - 40px); }
#toast.visible { opacity:1; }
#toast.error { color:var(--red); border-color:var(--red); }
</style>
</head>
<body>
<div id="rag-app">
  <header id="dash-header">
    <div class="header-left">
      <a href="/" style="text-decoration:none"><span class="logo">Dashboard</span></a>
      <span style="color:var(--text3);font-size:12px">›</span>
      <span class="logo" style="color:var(--text2)">Knowledge Base</span>
    </div>
  </header>
  <main id="rag-main"></main>
</div>
<div id="toast"></div>
<script>
let toastTimer = null
function showToast(message, isError = false) {
  const toast = document.getElementById('toast')
  toast.textContent = message
  toast.className = 'visible' + (isError ? ' error' : '')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { toast.className = '' }, 3500)
}
;(async () => {
  const container = document.getElementById('rag-main')
  try {
    const scope = await PrismDocuments.permissions()
    await PrismDocuments.mount(container, {...scope, toast: showToast}).ready
  } catch (error) {
    const notice = document.createElement('p')
    notice.style.cssText = 'padding:20px;color:var(--text3)'
    notice.textContent = 'Could not load knowledge base: ' + error.message
    container.appendChild(notice)
  }
})()
</script>
</body>
</html>
