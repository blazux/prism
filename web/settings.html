<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — PRISM</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
<!-- Applies the saved theme (sets CSS vars on :root) before the page renders -->
<script src="/theme.js"></script>
<style>
html, body { height: 100%; overflow: hidden; margin: 0; }
#settings-app { display: flex; flex-direction: column; zoom: var(--ui-scale, 1); height: calc(100vh / var(--ui-scale, 1)); }
.brain-sub { background: var(--bg2); border: 1px solid var(--border2); color: var(--text2); font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.brain-sub:hover { color: var(--text); }
.brain-sub.active { background: var(--bg3); color: var(--accent); border-color: var(--accent); }
.brain-sub svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }
.config-cat-header { display: flex; align-items: center; gap: 7px; }
.config-cat-icon { display: inline-flex; align-items: center; line-height: 0; }
.ag-label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); margin-bottom: 14px; }
.ag-label input, .ag-label textarea { text-transform: none; letter-spacing: 0; background: var(--bg2); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; }
.ag-label textarea { resize: vertical; line-height: 1.5; }
.ag-status { font-size: 12px; color: var(--accent); }
.ag-ws { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--bg1); }
.ag-ws > summary { padding: 10px 12px; cursor: pointer; font-weight: 600; color: var(--text); font-size: 13px; user-select: none; }
.ag-ws[open] > summary { border-bottom: 1px solid var(--border); }
.ag-ws textarea { width: calc(100% - 24px); margin: 10px 12px 0; box-sizing: border-box; background: var(--bg2); color: var(--text); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px; resize: vertical; line-height: 1.5; }
.ag-ws-foot { display: flex; align-items: center; gap: 10px; padding: 8px 12px 12px; }
.ag-ws-status { font-size: 12px; color: var(--accent); }
.appe-card { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.appe-row { display: flex; align-items: center; gap: 12px; }
.appe-row > label { width: 140px; flex-shrink: 0; font-size: 12.5px; color: var(--text2); }
.appe-row select, .appe-row input[type=text] { background: var(--bg2); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }
.appe-swatches { display: flex; gap: 6px; margin-top: 2px; }
.appe-sw { height: 26px; border-radius: 6px; border: 1px solid var(--border); flex: 1; }
input[type=color] { width: 42px; height: 28px; padding: 0; border: 1px solid var(--border2); border-radius: 6px; background: none; cursor: pointer; }

/* ── Main layout ──────────────────────────────────────────────────────────── */
#settings-main {
  display: flex;
  flex: 1;
  min-height: 0;
}

/* ── Left nav ─────────────────────────────────────────────────────────────── */
#settings-nav {
  width: 192px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  background: var(--bg1);
  padding: 12px 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  cursor: pointer;
  color: var(--text3);
  font-size: 13px;
  font-weight: 500;
  border-radius: 0;
  transition: color 0.15s, background 0.15s;
  user-select: none;
}
.nav-item:hover { color: var(--text); background: var(--bg2); }
.nav-item.active { color: var(--text); background: var(--bg3); }
.nav-icon { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav-icon svg { width: 17px; height: 17px; }

/* ── Content area ─────────────────────────────────────────────────────────── */
#settings-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}
.settings-page {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px 32px;
  min-height: 0;
}
.settings-page-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 16px;
}

/* ── RAG tab: internal layout ─────────────────────────────────────────────── */
#rag-tab {
  flex: 1;
  display: flex;
  min-height: 0;
  overflow: hidden;
}
#rag-sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  background: var(--bg1);
  overflow: hidden;
}
#rag-sidebar-header {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
#rag-sidebar-title {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text3);
}
#new-collection-btn {
  background: none;
  border: 1px solid var(--border2);
  color: var(--text3);
  font-size: 16px;
  line-height: 1;
  width: 22px;
  height: 22px;
  border-radius: 4px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.1s, border-color 0.1s;
}
#new-collection-btn:hover { color: var(--accent); border-color: var(--accent); }
#collections-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.collection-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 16px;
  cursor: pointer;
  transition: background 0.1s;
  gap: 8px;
}
.collection-item:hover { background: var(--bg2); }
.collection-item.active { background: var(--bg3); }
.collection-name { font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.collection-count { font-size: 10.5px; color: var(--text3); flex-shrink: 0; }
.collection-del {
  background: none; border: none; color: var(--text3); font-size: 13px;
  cursor: pointer; padding: 2px 4px; border-radius: 3px;
  opacity: 0; transition: opacity 0.1s, color 0.1s; flex-shrink: 0;
}
.collection-item:hover .collection-del { opacity: 1; }
.collection-del:hover { color: var(--red); }
#rag-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}
#rag-content-header {
  padding: 16px 24px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  gap: 12px;
}
#upload-zone {
  border: 2px dashed var(--border2);
  border-radius: 10px;
  margin: 16px 24px 0;
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  flex-shrink: 0;
}
#upload-zone:hover, #upload-zone.drag-over { border-color: var(--accent); background: rgba(107,138,253,0.04); }
#upload-zone.uploading { pointer-events: none; opacity: 0.6; }
#upload-icon { font-size: 24px; margin-bottom: 6px; opacity: 0.5; }
#upload-label { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
#upload-hint { font-size: 11.5px; color: var(--text3); }
#upload-input { display: none; }
#upload-progress { display: none; margin: 10px 24px 0; font-size: 12px; color: var(--text3); text-align: center; }
#upload-progress.visible { display: block; }
#docs-area { flex: 1; overflow-y: auto; padding: 16px 24px 24px; min-height: 0; }
#docs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
#docs-table th {
  text-align: left; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; color: var(--text3);
  padding: 6px 10px; border-bottom: 1px solid var(--border);
}
#docs-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); color: var(--text2); vertical-align: middle; }
#docs-table td:first-child { color: var(--text); font-family: var(--mono); font-size: 11.5px; }
#docs-table tr:last-child td { border-bottom: none; }
#docs-table tr:hover td { background: var(--bg2); }
.doc-del-btn {
  background: none; border: none; color: var(--text3); cursor: pointer;
  font-size: 13px; padding: 3px 6px; border-radius: 4px;
  transition: color 0.1s, background 0.1s;
}
.doc-del-btn:hover { color: var(--red); background: rgba(224,108,117,0.1); }
#no-collection-msg {
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 10px; color: var(--text3); font-size: 13px;
  padding: 40px 0; flex: 1;
}
#no-collection-msg .icon { font-size: 36px; opacity: 0.2; }

/* ── Modal ────────────────────────────────────────────────────────────────── */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.55);
  backdrop-filter: blur(3px); z-index: 100;
  display: none; align-items: center; justify-content: center;
}
#modal-overlay.visible { display: flex; }
#modal {
  background: var(--bg1); border: 1px solid var(--border2);
  border-radius: 10px; padding: 24px; width: 340px;
  display: flex; flex-direction: column; gap: 14px;
}
#modal h3 { font-size: 13px; font-weight: 700; color: var(--text); margin: 0; }
#modal input {
  background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius);
  color: var(--text); font-size: 13px; font-family: var(--sans);
  padding: 8px 12px; outline: none; width: 100%; box-sizing: border-box;
  transition: border-color 0.15s;
}
#modal input:focus { border-color: var(--accent); }
#modal-hint { font-size: 11.5px; color: var(--text3); margin-top: -6px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn {
  background: var(--bg3); border: 1px solid var(--border2); color: var(--text2);
  font-size: 12.5px; font-family: var(--sans); padding: 7px 16px;
  border-radius: var(--radius); cursor: pointer; transition: background 0.1s, color 0.1s;
}
.btn:hover { background: var(--bg4); color: var(--text); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #7c9bff; }

/* ── Email tab ─────────────────────────────────────────────────────────────── */
.eplogos { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.eplogo { flex: 1; min-width: 72px; padding: 12px 8px; border: 1px solid var(--border2); border-radius: 10px; background: var(--bg2); cursor: pointer; text-align: center; font-size: 12px; color: var(--text2); transition: border-color .12s, color .12s; }
.eplogo .epi { font-size: 22px; display: block; margin-bottom: 4px; }
.eplogo:hover { color: var(--text); }
.eplogo.sel { border-color: var(--accent); color: var(--text); background: var(--bg3); }
.efield { margin-bottom: 12px; }
.efield label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text2); margin-bottom: 4px; }
.efield input, .efield select { width: 100%; background: var(--bg2); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 7px 9px; font: inherit; }
.erow2 { display: grid; grid-template-columns: 1fr 90px; gap: 10px; }
.eprov-hint { font-size: 12px; color: var(--text2); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 12px; line-height: 1.45; }
.eprov-hint b { color: var(--text); }
#e-adv { margin-bottom: 12px; }
#e-adv > summary { cursor: pointer; font-size: 12px; color: var(--text2); padding: 4px 0; user-select: none; }
#e-adv[open] > summary { margin-bottom: 8px; }

/* ── Toast ────────────────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 24px; right: 24px; background: var(--bg3);
  border: 1px solid var(--border2); border-radius: var(--radius);
  padding: 10px 16px; font-size: 12.5px; color: var(--text); z-index: 999;
  opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
}
#toast.visible { opacity: 1; transform: translateY(0); }
#toast.error { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div id="settings-app">

  <header id="dash-header">
    <div class="header-left">
      <a id="back-link" href="/" style="display:flex;align-items:center;gap:6px;text-decoration:none;color:var(--text3);font-size:12.5px;transition:color .15s" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text3)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        PRISM
      </a>
      <span style="color:var(--text3);font-size:12px">›</span>
      <span class="logo" style="color:var(--text2);font-size:13px;font-weight:600">Settings</span>
      <span id="session-badge" style="font-size:10.5px;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;margin-left:4px"></span>
    </div>
    <div class="header-right">
      <button id="logout-btn" onclick="logout()" style="display:none;background:transparent;border:1px solid var(--border2);color:var(--text3);font-size:11.5px;padding:4px 10px;border-radius:var(--radius);cursor:pointer;transition:color .15s,border-color .15s" onmouseover="this.style.color='var(--red)';this.style.borderColor='var(--red)'" onmouseout="this.style.color='var(--text3)';this.style.borderColor='var(--border2)'">Sign out</button>
    </div>
  </header>

  <div id="settings-main">

    <nav id="settings-nav">
      <div class="nav-item active" data-tab="tools">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span> Tools
      </div>
      <div class="nav-item" data-tab="agent">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></span> Agent
      </div>
      <div class="nav-item" data-tab="channels">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></span> Channels
      </div>
      <div class="nav-item" data-tab="mcp">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg></span> MCP
      </div>
      <div class="nav-item" data-tab="secrets">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4"/><path d="m18 5 2 2"/><path d="m15 8 2 2"/></svg></span> Secrets
      </div>
      <div class="nav-item" data-tab="email">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 6 10-6"/></svg></span> Email
      </div>
      <div class="nav-item" data-tab="notes">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H2z"/><path d="M22 6a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg></span> Notes
      </div>
      <div class="nav-item" data-tab="calendar">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span> Calendar
      </div>
      <div class="nav-item" data-tab="knowledge">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span> Knowledge
      </div>
      <div class="nav-item" data-tab="appearance">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".6" fill="currentColor" stroke="none"/><circle cx="17.5" cy="10.5" r=".6" fill="currentColor" stroke="none"/><circle cx="8.5" cy="7.5" r=".6" fill="currentColor" stroke="none"/><circle cx="6.5" cy="12.5" r=".6" fill="currentColor" stroke="none"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.555C21.965 6.012 17.461 2 12 2z"/></svg></span> Appearance
      </div>
    </nav>

    <div id="settings-content">
      <!-- rendered by JS -->
    </div>

  </div>
</div>

<!-- New collection modal -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <h3>New collection</h3>
    <input id="modal-input" type="text" placeholder="e.g. my-docs" maxlength="60"
           onkeydown="if(event.key==='Enter')createCollection()">
    <div id="modal-hint">Letters, numbers, hyphens. Will be lowercased.</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="createCollection()">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const SESSION = new URLSearchParams(window.location.search).get('session') || 'default'
const CONFIG_KEY = 'agent-config'
let currentTab = window.location.hash.replace('#', '') || 'tools'
let customTools = []
let mcpServers = []

// ── Bootstrap ─────────────────────────────────────────────────────────────────

document.getElementById('session-badge').textContent = SESSION
document.getElementById('back-link').href = '/'

document.querySelectorAll('.nav-item').forEach(el => {
  el.classList.toggle('active', el.dataset.tab === currentTab)
  el.addEventListener('click', () => switchTab(el.dataset.tab))
})

requestAnimationFrame(() => renderTab(currentTab))

// ── Tab switching ─────────────────────────────────────────────────────────────

function switchTab(tab) {
  currentTab = tab
  window.location.hash = tab
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab)
  })
  renderTab(tab)
}

function renderTab(tab) {
  const content = document.getElementById('settings-content')
  content.innerHTML = ''
  if (tab === 'tools')   renderToolsTab(content)
  else if (tab === 'agent') renderAgentTab(content)
  else if (tab === 'channels') renderChannelsTab(content)
  else if (tab === 'mcp')     renderMCPTab(content)
  else if (tab === 'secrets') renderSecretsTab(content)
  else if (tab === 'email') renderEmailTab(content)
  else if (tab === 'notes') renderNotesTab(content)
  else if (tab === 'calendar') renderCalendarTab(content)
  else if (tab === 'knowledge') renderBrainTab(content)
  else if (tab === 'appearance') renderAppearanceTab(content)
}

// ── Appearance: theme studio (accent → palette), UI scale, density, bg ──────────
function renderAppearanceTab(container) {
  const T = window.PrismTheme
  const pane = document.createElement('div')
  pane.style.cssText = 'padding:18px;overflow-y:auto;max-width:560px'
  pane.innerHTML = `
    <p class="settings-page-title">Theme</p>
    <div class="appe-card">
      <div class="appe-row"><label>Active theme</label><select id="appe-theme"></select></div>
    </div>

    <p class="settings-page-title" style="margin-top:20px">Create a custom theme</p>
    <div class="appe-card">
      <div class="appe-row"><label>Accent color</label>
        <span style="display:flex;gap:8px;align-items:center"><input type="color" id="appe-accent" value="#6b8afd"><input type="text" id="appe-accent-hex" value="#6b8afd" style="width:90px"></span></div>
      <div class="appe-row"><label>Mode</label>
        <select id="appe-mode"><option value="dark">Dark</option><option value="light">Light</option></select></div>
      <div class="appe-row"><label>Harmony</label>
        <select id="appe-harmony"><option value="monochromatic">Monochromatic</option><option value="analogous">Analogous</option><option value="complementary">Complementary</option><option value="triadic">Triadic</option></select></div>
      <div class="appe-swatches" id="appe-swatches"></div>
      <details style="margin-top:2px"><summary style="cursor:pointer;font-size:12px;color:var(--text2);user-select:none">Edit every color</summary>
        <div id="appe-colors" style="display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;margin-top:8px"></div></details>
      <div class="appe-row" style="margin-top:6px"><label>Name</label><input type="text" id="appe-name" placeholder="My theme" style="flex:1"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
        <button class="btn" id="appe-preview">Preview</button>
        <button class="btn btn-primary" id="appe-save">Save & apply</button>
      </div>
    </div>
    <div id="appe-custom-list" style="margin-top:10px;display:flex;flex-direction:column;gap:6px"></div>

    <p class="settings-page-title" style="margin-top:20px">Interface</p>
    <div class="appe-card">
      <div class="appe-row"><label>UI scale</label>
        <select id="appe-scale"><option value="90">90%</option><option value="100">100%</option><option value="110">110%</option><option value="125">125%</option><option value="140">140%</option></select></div>
      <div class="appe-row"><label>Density</label>
        <select id="appe-density"><option value="compact">Compact</option><option value="comfortable">Comfortable</option><option value="spacious">Spacious</option></select></div>
      <div class="appe-row"><label>Animated background</label>
        <span style="display:flex;gap:10px;align-items:center;flex:1;max-width:240px"><input type="range" id="appe-bgfx" min="0" max="100" step="5" style="flex:1"><span id="appe-bgfx-val" style="font-size:12px;color:var(--text2);width:34px;text-align:right"></span></span></div>
      <div class="appe-row"><label>Interface font</label>
        <select id="appe-font">
          <option value="">System (default)</option>
          <option value="'Inter', -apple-system, 'Segoe UI', sans-serif">Inter</option>
          <option value="'Helvetica Neue', Arial, sans-serif">Helvetica / Arial</option>
          <option value="Georgia, 'Times New Roman', serif">Serif</option>
          <option value="'JetBrains Mono', 'Cascadia Code', ui-monospace, monospace">Monospace</option>
          <option value="'SF Pro Rounded', 'Segoe UI Variable', system-ui, sans-serif">Rounded</option>
          <option value="__custom__">Custom…</option>
        </select></div>
      <div class="appe-row" id="appe-font-custom-row" style="display:none"><label>Custom font</label>
        <input id="appe-font-custom" placeholder="e.g. 'IBM Plex Sans', sans-serif" style="flex:1;max-width:300px"></div>
    </div>
    <div class="appe-card">
      <div class="appe-row"><label>Chat panel side</label>
        <select id="appe-chatside"><option value="right">Right</option><option value="left">Left</option></select></div>
      <div class="appe-row"><label>Open chat on load</label>
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;flex:1"><input type="checkbox" id="appe-chatdefault"><span style="font-size:12px;color:var(--text2)">Start with the chat panel open</span></label></div>
      <div class="appe-row"><label>Snap &amp; align windows</label>
        <label style="display:flex;align-items:center;gap:7px;cursor:pointer;flex:1"><input type="checkbox" id="appe-snap"><span style="font-size:12px;color:var(--text2)">Magnetic edges &amp; matching sizes (hold Alt to bypass)</span></label></div>
    </div>`
  container.appendChild(pane)

  // Active theme picker
  const themeSel = pane.querySelector('#appe-theme')
  T.populateSelect(themeSel)

  // Custom theme builder — `pal` is the working palette (source of truth).
  const accent = pane.querySelector('#appe-accent'), accentHex = pane.querySelector('#appe-accent-hex')
  const modeSel = pane.querySelector('#appe-mode'), harmSel = pane.querySelector('#appe-harmony')
  const swatches = pane.querySelector('#appe-swatches'), colorsEl = pane.querySelector('#appe-colors')
  const TOKENS = [
    ['--bg', 'Background'], ['--bg1', 'Surface 1'], ['--bg2', 'Surface 2'], ['--bg3', 'Surface 3'], ['--bg4', 'Surface 4'],
    ['--border', 'Border'], ['--border2', 'Border 2'],
    ['--text', 'Text'], ['--text2', 'Text muted'], ['--text3', 'Text faint'],
    ['--accent', 'Accent'], ['--accent-dim', 'Accent dim'],
    ['--green', 'Success'], ['--red', 'Error'], ['--yellow', 'Warning'], ['--orange', 'Orange'],
  ]
  let pal = T.generatePalette(accent.value, modeSel.value, harmSel.value)

  function renderSwatches() {
    const keys = ['--bg', '--bg2', '--bg4', '--border2', '--text', '--text2', '--accent']
    swatches.innerHTML = keys.map(k => `<span class="appe-sw" title="${k}" style="background:${pal[k]}"></span>`).join('')
  }
  function buildColorEditor() {
    colorsEl.innerHTML = ''
    for (const [tok, label] of TOKENS) {
      const row = document.createElement('label')
      row.style.cssText = 'display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text2);cursor:pointer'
      row.innerHTML = `<input type="color" value="${pal[tok] || '#000000'}" data-tok="${tok}" style="width:32px;height:22px"><span>${label}</span>`
      const inp = row.querySelector('input')
      inp.addEventListener('input', () => { pal[tok] = inp.value; renderSwatches(); T.previewVars(pal) })
      colorsEl.appendChild(row)
    }
  }
  function syncColorInputs() { colorsEl.querySelectorAll('input[data-tok]').forEach(i => { i.value = pal[i.dataset.tok] || '#000000' }) }
  function regen() { pal = T.generatePalette(accent.value, modeSel.value, harmSel.value); renderSwatches(); syncColorInputs(); T.previewVars(pal) }

  accent.addEventListener('input', () => { accentHex.value = accent.value; regen() })
  accentHex.addEventListener('change', () => { if (/^#[0-9a-fA-F]{6}$/.test(accentHex.value)) { accent.value = accentHex.value; regen() } })
  modeSel.addEventListener('change', regen)
  harmSel.addEventListener('change', regen)
  renderSwatches(); buildColorEditor()
  pane.querySelector('#appe-preview').addEventListener('click', () => T.previewVars(pal))
  pane.querySelector('#appe-save').addEventListener('click', () => {
    const name = (pane.querySelector('#appe-name').value || '').trim() || 'Custom'
    const id = 'custom-' + Date.now()
    T.saveCustomTheme(id, name, Object.assign({}, pal))
    T.applyTheme(id)
    T.populateSelect(themeSel)
    renderCustomList()
    showToast('Theme saved')
  })

  // Custom theme list (delete)
  const customList = pane.querySelector('#appe-custom-list')
  function renderCustomList() {
    const all = T.getAllThemes()
    const customs = Object.entries(all).filter(([, t]) => t.custom)
    customList.innerHTML = customs.length ? '' : '<div style="font-size:12px;color:var(--text3)">No custom themes yet.</div>'
    for (const [id, t] of customs) {
      const row = document.createElement('div')
      row.style.cssText = 'display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 10px'
      row.innerHTML = `<span style="flex:1;color:var(--text);font-size:13px">${escHtml(t.label)} <span style="color:var(--accent)">✦</span></span>
        <button class="btn appe-apply">Apply</button><button class="btn appe-del" style="color:var(--red)">Delete</button>`
      row.querySelector('.appe-apply').addEventListener('click', () => { T.applyTheme(id); T.populateSelect(themeSel) })
      row.querySelector('.appe-del').addEventListener('click', () => { if (confirm(`Delete theme "${t.label}"?`)) { T.deleteCustomTheme(id); T.populateSelect(themeSel); renderCustomList() } })
      customList.appendChild(row)
    }
  }
  renderCustomList()

  // Import / export custom themes (JSON)
  const ioBar = document.createElement('div')
  ioBar.style.cssText = 'display:flex;gap:8px;margin-top:8px'
  ioBar.innerHTML = `<button class="btn" id="appe-export">${icon('download',14)} Export</button><button class="btn" id="appe-import">${icon('upload',14)} Import</button><input type="file" id="appe-import-file" accept="application/json" style="display:none">`
  pane.querySelector('#appe-custom-list').after(ioBar)
  ioBar.querySelector('#appe-export').onclick = () => {
    const customs = Object.entries(T.getAllThemes()).filter(([, t]) => t.custom).map(([id, t]) => ({ id, label: t.label, vars: t.vars }))
    if (!customs.length) { showToast('No custom themes to export'); return }
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([JSON.stringify(customs, null, 2)], { type: 'application/json' }))
    a.download = 'prism-themes.json'; a.click()
  }
  const fileInp = ioBar.querySelector('#appe-import-file')
  ioBar.querySelector('#appe-import').onclick = () => fileInp.click()
  fileInp.onchange = async () => {
    const f = fileInp.files[0]; if (!f) return
    try {
      const arr = JSON.parse(await f.text()); let n = 0
      for (const t of (Array.isArray(arr) ? arr : [])) {
        if (t && t.vars) T.saveCustomTheme('custom-' + Date.now() + '-' + (n++), t.label || 'Imported', t.vars)
      }
      T.populateSelect(themeSel); renderCustomList(); showToast(`Imported ${n} theme(s)`)
    } catch { showToast('Invalid theme file') }
    fileInp.value = ''
  }

  // Interface prefs
  const scaleSel = pane.querySelector('#appe-scale'), densSel = pane.querySelector('#appe-density')
  const bgfx = pane.querySelector('#appe-bgfx'), bgfxVal = pane.querySelector('#appe-bgfx-val')
  scaleSel.value = T.getPref(T.KEYS.SCALE, '100'); scaleSel.addEventListener('change', () => T.applyUIScale(scaleSel.value))
  densSel.value = T.getPref(T.KEYS.DENSITY, 'comfortable'); densSel.addEventListener('change', () => T.applyDensity(densSel.value))
  bgfx.value = T.getPref(T.KEYS.BGFX, '100'); bgfxVal.textContent = bgfx.value + '%'
  bgfx.addEventListener('input', () => { bgfxVal.textContent = bgfx.value + '%'; T.applyBgfx(bgfx.value) })

  // Interface font (presets + custom). Matches a preset option, else "Custom…".
  const fontSel = pane.querySelector('#appe-font'), fontCustom = pane.querySelector('#appe-font-custom'), fontRow = pane.querySelector('#appe-font-custom-row')
  const curFont = T.getPref(T.KEYS.FONT, '')
  const preset = [...fontSel.options].some(o => o.value === curFont)
  fontSel.value = preset ? curFont : (curFont ? '__custom__' : '')
  fontCustom.value = preset ? '' : curFont
  fontRow.style.display = fontSel.value === '__custom__' ? '' : 'none'
  fontSel.addEventListener('change', () => {
    if (fontSel.value === '__custom__') { fontRow.style.display = ''; T.applyFont(fontCustom.value.trim()) }
    else { fontRow.style.display = 'none'; T.applyFont(fontSel.value) }
  })
  fontCustom.addEventListener('input', () => { if (fontSel.value === '__custom__') T.applyFont(fontCustom.value.trim()) })

  // Layout
  const chatSide = pane.querySelector('#appe-chatside'), chatDefault = pane.querySelector('#appe-chatdefault')
  chatSide.value = T.getPref(T.KEYS.CHATSIDE, 'right')
  chatSide.addEventListener('change', () => T.applyChatSide(chatSide.value))
  chatDefault.checked = localStorage.getItem('prism-chat-default') === 'open'
  chatDefault.addEventListener('change', () => localStorage.setItem('prism-chat-default', chatDefault.checked ? 'open' : 'closed'))
  const snap = pane.querySelector('#appe-snap')
  snap.checked = localStorage.getItem('prism-window-snap') !== '0'
  snap.addEventListener('change', () => localStorage.setItem('prism-window-snap', snap.checked ? '1' : '0'))
}

async function renderSkillsPanel(container) {
  const pane = document.createElement('div')
  pane.style.cssText = 'padding:16px;overflow-y:auto'
  pane.innerHTML = '<p class="settings-page-title">Saved skills</p>'
    + '<div style="font-size:12px;color:var(--text2);margin:-4px 0 12px;line-height:1.5">Reusable procedures the agent learns. It now <b>self-improves</b>: after a non-trivial multi-step task it saves a skill, and refines an existing one when it finds a better way — so it gets better at recurring work over time.</div>'
    + '<div id="skills-list" style="display:flex;flex-direction:column;gap:8px"></div>'
  container.appendChild(pane)
  const list = pane.querySelector('#skills-list')
  let skills = []
  try { skills = (await (await fetch('/api/skills')).json()).skills || [] } catch {}
  if (!skills.length) {
    list.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:20px 0">No skills yet. The agent saves procedures here as it learns them.</div>'
    return
  }
  for (const sk of skills) {
    const card = document.createElement('div')
    card.style.cssText = 'background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px'
    const when = sk.when_to_use || sk.description || ''
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px">
        <strong style="flex:1;color:var(--text)">${escHtml(sk.name)}</strong>
        <button class="btn sk-view">View</button>
        <button class="btn sk-del" style="color:var(--red)">Delete</button>
      </div>
      ${when ? `<div style="font-size:12px;color:var(--text2);margin-top:4px">${escHtml(when)}</div>` : ''}
      <pre class="sk-body" style="display:none;white-space:pre-wrap;font-size:12px;color:var(--text2);margin-top:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px"></pre>`
    card.querySelector('.sk-view').addEventListener('click', async () => {
      const body = card.querySelector('.sk-body')
      if (body.style.display === 'none') {
        if (!body.textContent) {
          try { const d = await (await fetch('/api/skills?name=' + encodeURIComponent(sk.name))).json(); body.textContent = d.skill?.body || '(empty)' } catch { body.textContent = '(error)' }
        }
        body.style.display = ''
      } else body.style.display = 'none'
    })
    card.querySelector('.sk-del').addEventListener('click', async () => {
      if (!confirm(`Delete skill "${sk.name}"?`)) return
      await fetch('/api/skills?name=' + encodeURIComponent(sk.name), { method: 'DELETE' })
      renderTab('knowledge')
    })
    list.appendChild(card)
  }
}

// ── Shared helpers ─────────────────────────────────────────────────────────────

function getConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}') } catch { return {} }
}
function getDisabled() { return new Set(getConfig().disabled || []) }
function isEnabled(id) { return !getDisabled().has(id) }
function setEnabled(id, on) {
  const cfg = getConfig()
  const d = new Set(cfg.disabled || [])
  on ? d.delete(id) : d.add(id)
  cfg.disabled = [...d]
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg))
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

function makeToolCard(id, name, desc, subtext) {
  const on = isEnabled(id)
  const card = document.createElement('div')
  card.className = 'config-tool-card' + (on ? '' : ' disabled')
  card.id = `tool-card-${CSS.escape(id)}`
  card.innerHTML = `
    <div class="config-tool-info">
      <div class="config-tool-name">${escHtml(name)}</div>
      <div class="config-tool-desc">${escHtml(desc)}</div>
      ${subtext ? `<span class="config-tool-id">${escHtml(subtext)}</span>` : ''}
    </div>
    <label class="toggle-switch" title="${on ? 'Disable' : 'Enable'}">
      <input type="checkbox" ${on ? 'checked' : ''} data-id="${escHtml(id)}">
      <span class="toggle-track"></span>
    </label>`
  card.querySelector('input').addEventListener('change', function() {
    setEnabled(this.dataset.id, this.checked)
    card.classList.toggle('disabled', !this.checked)
  })
  return card
}

function makeSectionHeader(icon, color, label) {
  const hdr = document.createElement('div')
  hdr.className = 'config-cat-header'
  hdr.innerHTML = `<span class="config-cat-icon" style="color:${color}">${icon}</span><span class="config-cat-name">${escHtml(label)}</span>`
  return hdr
}

// ── Agent tab — name, default personality, per-workspace adaptations ────────────
async function renderAgentTab(container) {
  const page = document.createElement('div')
  page.className = 'settings-page'
  page.style.cssText = 'padding:18px;overflow-y:auto;max-width:620px'
  container.appendChild(page)

  let name = '', base = '', sessions = []
  const NO_CACHE = { cache: 'no-store' }
  try { name = (await fetch('/api/agent/name', NO_CACHE).then(r => r.json())).name || '' } catch (_) {}
  try { base = (await fetch('/api/agent/personality', NO_CACHE).then(r => r.json())).personality || '' } catch (_) {}
  try { sessions = (await fetch('/api/sessions', NO_CACHE).then(r => r.json())).sessions || [] } catch (_) {}

  page.innerHTML = `
    <div class="config-cat-header"><span class="config-cat-icon" style="color:var(--accent)">${icon('agent')}</span><span class="config-cat-name">Agent identity</span></div>
    <div style="font-size:12px;color:var(--text2);margin:6px 0 14px;line-height:1.5">The name and base personality apply to your agent everywhere. Each workspace can layer its own tweaks on top.</div>
    <label class="ag-label">Name<input id="ag-name" type="text" placeholder="e.g. Prism, Jarvis…" value="${escHtml(name)}"></label>
    <label class="ag-label">Default personality
      <textarea id="ag-base" rows="9" placeholder="The base persona applied everywhere — tone, style, rules, what it should focus on.">${escHtml(base)}</textarea></label>
    <div style="display:flex;gap:10px;align-items:center;margin-top:4px">
      <button class="btn btn-primary" id="ag-save">Save</button>
      <span id="ag-status" class="ag-status"></span>
    </div>

    <div class="config-cat-header" style="margin-top:26px"><span class="config-cat-icon" style="color:var(--accent)">${icon('layers')}</span><span class="config-cat-name">Per-workspace adaptations</span></div>
    <div style="font-size:12px;color:var(--text2);margin:6px 0 12px;line-height:1.5">Extra instructions layered on top of the default for one workspace. Leave blank to use the default as-is.</div>
    <div id="ag-workspaces"></div>`

  page.querySelector('#ag-save').addEventListener('click', async () => {
    const st = page.querySelector('#ag-status'); st.textContent = 'Saving…'
    try {
      await fetch('/api/agent/name', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: page.querySelector('#ag-name').value }) })
      await fetch('/api/agent/personality', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ personality: page.querySelector('#ag-base').value }) })
      st.textContent = '✓ Saved — takes effect on the next message'
    } catch (e) { st.textContent = 'Failed: ' + e.message }
    setTimeout(() => { st.textContent = '' }, 3000)
  })

  const wsHost = page.querySelector('#ag-workspaces')
  // 'assistant' is the internal global assistant, not a user workspace.
  const wsList = sessions.filter(s => s.id !== 'assistant')
  if (!wsList.length) { wsHost.innerHTML = '<div style="color:var(--text3);font-size:12px">No workspaces yet.</div>'; return }
  for (const s of wsList) {
    const card = document.createElement('details')
    card.className = 'ag-ws'
    const label = escHtml(s.name) || 'Untitled workspace'
    card.innerHTML = `<summary>${label}</summary>
      <textarea rows="4" placeholder="Adaptation for this workspace…"></textarea>
      <div class="ag-ws-foot"><button class="btn ag-ws-save">Save</button><span class="ag-ws-status"></span></div>`
    const ta = card.querySelector('textarea')
    card.addEventListener('toggle', async () => {
      if (card.open && !ta.dataset.loaded) {
        ta.dataset.loaded = '1'
        try { ta.value = (await fetch(`/api/personality?session=${encodeURIComponent(s.id)}`).then(r => r.json())).personality || '' } catch (_) {}
      }
    })
    card.querySelector('.ag-ws-save').addEventListener('click', async () => {
      const st = card.querySelector('.ag-ws-status'); st.textContent = 'Saving…'
      try {
        await fetch(`/api/personality?session=${encodeURIComponent(s.id)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ personality: ta.value }) })
        st.textContent = '✓ Saved'
      } catch (e) { st.textContent = 'Failed' }
      setTimeout(() => { st.textContent = '' }, 2500)
    })
    wsHost.appendChild(card)
  }
}

async function renderMCPTab(container) {
  const page = document.createElement('div')

  const [serversRes, secretsRes] = await Promise.allSettled([

    fetch('/api/secrets').then(r => r.json()),
  ])
  mcpServers = serversRes.status === 'fulfilled' ? (serversRes.value.servers || []) : []
  const secretNames = secretsRes.status === 'fulfilled' ? (secretsRes.value.secrets || []) : []

      <input id="mcp-add-name" class="mcp-input" type="text" placeholder="Nom (ex: filesystem)" autocomplete="off">

function renderMCPServerList(page) {
  let listEl = document.getElementById('mcp-server-list')
  if (!listEl) {
    listEl = document.createElement('div')
    listEl.id = 'mcp-server-list'
    page.insertBefore(listEl, page.firstChild)
  }
  listEl.innerHTML = ''

  if (mcpServers.length === 0) {
    listEl.innerHTML = '<div class="mcp-empty">Aucun serveur MCP configuré.</div>'
    return
  }
  for (const srv of mcpServers) {
    const card = document.createElement('div')
    card.className = 'mcp-server-card'
    const toolCount = srv.tools ? srv.tools.length : 0
    card.innerHTML = `
      <div class="mcp-server-header">
        <div class="mcp-server-info">
          <span class="mcp-server-name">${escHtml(srv.name)}</span>
          <span class="mcp-server-url">${escHtml(srv.url)}</span>
        </div>
        <div class="mcp-server-actions">
          <span class="mcp-tool-count">${toolCount} outil${toolCount !== 1 ? 's' : ''}</span>
          <label class="toggle-switch" title="${srv.enabled ? 'Désactiver' : 'Activer'}">
            <input type="checkbox" ${srv.enabled ? 'checked' : ''} data-srv-id="${escHtml(srv.id)}">
            <span class="toggle-track"></span>
          </label>
          <button class="mcp-server-del" title="Supprimer" data-srv-id="${escHtml(srv.id)}">✕</button>
        </div>
      </div>`

    if (toolCount > 0) {
      const toolsSection = document.createElement('div')
      toolsSection.className = 'mcp-server-tool-grid'
      if (!srv.enabled) toolsSection.style.opacity = '0.4'
      const grid = document.createElement('div')
      grid.className = 'config-tools-grid'
      for (const t of srv.tools) {
        grid.appendChild(makeToolCard(t.name, t.name, t.description || '', null))
      }
      toolsSection.appendChild(grid)
      card.appendChild(toolsSection)
    }

    card.querySelector('input[type=checkbox]').addEventListener('change', function() {
      patchMCPServer(this.dataset.srvId, this.checked)
    })
    card.querySelector('.mcp-server-del').addEventListener('click', function() {
      deleteMCPServer(this.dataset.srvId)
    })
    listEl.appendChild(card)
  }
}

async function addMCPServer() {
  const name   = document.getElementById('mcp-add-name').value.trim()
  const url    = document.getElementById('mcp-add-url').value.trim()
  const secret = document.getElementById('mcp-add-secret').value.trim()
  const status = document.getElementById('mcp-add-status')
  const btn    = document.getElementById('mcp-add-btn')
  if (!name || !url) { status.textContent = 'Nom et URL requis.'; status.className = 'mcp-add-status error'; return }
  btn.disabled = true
  status.textContent = 'Connexion…'; status.className = 'mcp-add-status'
  try {
    const res = await fetch(`/api/mcp/servers?session=${encodeURIComponent(SESSION)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, url, authSecret: secret || undefined }),
    })
    if (!res.ok) throw new Error(await res.text())
    const data = await res.json()
    status.textContent = `✓ ${data.count} outil(s) chargé(s)`; status.className = 'mcp-add-status ok'
    document.getElementById('mcp-add-name').value = ''
    document.getElementById('mcp-add-url').value = ''
    document.getElementById('mcp-add-secret').value = ''
    // Reload list
    const r2 = await fetch(`/api/mcp/servers?session=${encodeURIComponent(SESSION)}`)
    mcpServers = (await r2.json()).servers || []
    renderMCPServerList(document.querySelector('.settings-page'))
  } catch(e) {
    status.textContent = 'Erreur : ' + e.message; status.className = 'mcp-add-status error'
  } finally { btn.disabled = false }
}

async function patchMCPServer(id, enabled) {
  await fetch(`/api/mcp/servers/${encodeURIComponent(id)}?session=${encodeURIComponent(SESSION)}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled }),
  }).catch(console.error)
  const res = await fetch(`/api/mcp/servers?session=${encodeURIComponent(SESSION)}`)
  mcpServers = (await res.json()).servers || []
  renderMCPServerList(document.querySelector('.settings-page'))
}

async function deleteMCPServer(id) {
  if (!confirm('Supprimer ce serveur MCP ?')) return
  await fetch(`/api/mcp/servers/${encodeURIComponent(id)}?session=${encodeURIComponent(SESSION)}`, { method: 'DELETE' }).catch(console.error)
  const res = await fetch(`/api/mcp/servers?session=${encodeURIComponent(SESSION)}`)
  mcpServers = (await res.json()).servers || []
  renderMCPServerList(document.querySelector('.settings-page'))
}

  page.appendChild(section)

  addForm.className = 'mcp-add-form'
  addForm.innerHTML = `
    <div class="mcp-add-title">Add a secret</div>
    <div class="mcp-add-fields">
      <input id="secret-add-name" class="mcp-input" type="text" placeholder="Name (e.g. MY_API_KEY)" autocomplete="off">

    </div>
    <button id="secret-add-btn" class="mcp-add-submit">Save</button>
    <div id="secret-add-status" class="mcp-add-status"></div>`

    const value = document.getElementById('secret-add-value').value
    const status = document.getElementById('secret-add-status')
    const btn   = document.getElementById('secret-add-btn')

    btn.disabled = true
    status.textContent = 'Saving…'; status.className = 'mcp-add-status'
    try {
      const res = await fetch('/api/secrets', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, value }),
      })
      if (!res.ok) throw new Error(await res.text())
      status.textContent = '✓ Saved'; status.className = 'mcp-add-status ok'
      document.getElementById('secret-add-name').value = ''
      document.getElementById('secret-add-value').value = ''

    const res = await fetch('/api/secrets')

    const names = data.secrets || []
    const list = document.getElementById('secrets-list')
    if (names.length === 0) {
      list.innerHTML = '<span style="color:var(--text3);font-size:12px">Aucun secret stocké.</span>'
    } else {
      list.innerHTML = ''
      for (const name of names) {
        const row = document.createElement('div')
        row.className = 'config-secret-row'
        row.id = `secret-row-${CSS.escape(name)}`
        row.innerHTML = `
          <div class="config-secret-info">
            <span class="config-secret-name">${escHtml(name)}</span>
            <span class="config-secret-env">$${escHtml(name.toUpperCase().replace(/[^A-Z0-9]/g,'_'))}</span>
          </div>
          <button class="config-secret-del" title="Supprimer" data-name="${escHtml(name)}">✕</button>`
        row.querySelector('button').addEventListener('click', async function() {
          const n = this.dataset.name
          if (!confirm(`Supprimer le secret "${n}" ?`)) return
          await fetch(`/api/secrets/${encodeURIComponent(n)}`, { method: 'DELETE' })
          document.getElementById(`secret-row-${CSS.escape(n)}`)?.remove()
        })
        list.appendChild(row)
      }
    }
  } catch {
    const list = document.getElementById('secrets-list')
    if (list) list.innerHTML = '<span style="color:var(--text3);font-size:12px">Indisponible (Postgres requis).</span>'
  }
}

    `<div class="eplogo${k === sel ? ' sel' : ''}" data-prov="${k}"><span class="epi">${p.icon}</span>${p.label}</div>`).join('')

  page.innerHTML = `
    <div class="config-cat-header"><span class="config-cat-icon" style="color:var(--accent)">${icon('mail')}</span><span class="config-cat-name">Mailbox</span></div>
    <div style="font-size:12px;color:var(--text2);margin:6px 0 16px;line-height:1.5">Pick your provider, then enter your email and password. Credentials are stored <b>encrypted</b> on your server.</div>
    <div class="eplogos">${logos}</div>
    <div class="efield"><label>Email</label><input id="e-user" value="${escHtml(cfg.user || '')}" placeholder="you@example.com"></div>
    <div class="efield"><label>Password</label><input id="e-pass" type="password" placeholder="${cfg.has_password ? '•••••• (unchanged)' : ''}"></div>
    <div class="efield"><label>Emails to load in the inbox</label><input id="e-limit" type="number" min="1" max="500" value="${cfg.list_limit || 60}" style="width:120px"></div>
    <div class="eprov-hint" id="e-hint"></div>
    <details id="e-adv">
      <summary>Advanced — server settings</summary>
      <div class="erow2">
        <div class="efield"><label>IMAP host</label><input id="e-ih" value="${escHtml(cfg.imap_host || '')}"></div>
        <div class="efield"><label>Port</label><input id="e-ip" value="${cfg.imap_port || ''}"></div>
      </div>
      <div class="erow2">
        <div class="efield"><label>SMTP host</label><input id="e-sh" value="${escHtml(cfg.smtp_host || '')}"></div>
        <div class="efield"><label>Port</label><input id="e-sp" value="${cfg.smtp_port || ''}"></div>
      </div>
      <div class="erow2">
        <div class="efield"><label>Security</label><select id="e-sec"><option value="ssl">SSL/TLS</option><option value="starttls">STARTTLS</option></select></div>
        <div class="efield" style="display:flex;align-items:flex-end;padding-bottom:7px"><label style="display:flex;gap:6px;align-items:center;text-transform:none;letter-spacing:0;cursor:pointer"><input type="checkbox" id="e-insec" style="width:auto"> self-signed</label></div>
      </div>
      <div class="efield"><label>From (optional)</label><input id="e-from" value="${escHtml(cfg.from || '')}" placeholder="defaults to email"></div>
    </details>
    <div id="e-err" style="color:var(--red);font-size:12px;min-height:14px"></div>
    <button class="btn btn-primary" id="e-save" style="margin-top:6px">Save & connect</button>`

  const $ = id => document.getElementById(id)
  const applyProvider = (name) => {
    const p = EMAIL_PROVIDERS[name]; if (!p) return
    $('e-ih').value = p.imap; $('e-ip').value = p.imapPort || ''
    $('e-sh').value = p.smtp; $('e-sp').value = p.smtpPort || ''
    $('e-sec').value = p.security || 'ssl'; $('e-insec').checked = !!p.insecure
    if (name === 'other' || p.insecure) $('e-adv').open = true
    $('e-hint').innerHTML = p.hint
  }
  page.querySelectorAll('.eplogo').forEach(el => el.addEventListener('click', () => {
    page.querySelectorAll('.eplogo').forEach(x => x.classList.toggle('sel', x === el))
    applyProvider(el.dataset.prov)
  }))
  // Only seed servers from the preset when none are saved yet.
  if (!cfg.imap_host) applyProvider(sel)
  else { $('e-sec').value = cfg.security || 'ssl'; $('e-insec').checked = !!cfg.insecure; $('e-hint').innerHTML = (EMAIL_PROVIDERS[sel] || {}).hint || '' }

  $('e-save').addEventListener('click', async () => {
    const v = id => $(id).value.trim()
    const body = {
      user: v('e-user'), imap_host: v('e-ih'), smtp_host: v('e-sh'), from: v('e-from'),
      imap_port: parseInt(v('e-ip')) || 0, smtp_port: parseInt(v('e-sp')) || 0,
      list_limit: Math.max(1, Math.min(500, parseInt(v('e-limit')) || 60)),
      security: $('e-sec').value, insecure: $('e-insec').checked,
    }
    const pass = $('e-pass').value
    if (pass) body.password = pass
    $('e-save').disabled = true; $('e-err').textContent = ''
    try {
      const res = await fetch('/api/email/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      if (!res.ok) throw new Error(await res.text())
      showToast('Mailbox saved')
    } catch (e) { $('e-err').textContent = 'Could not save: ' + e.message }
    finally { $('e-save').disabled = false }
  })
}

async function renderCalendarTab(container) {
  const wrap = document.createElement('div')

  wrap.innerHTML = `

    <div class="appe-card" style="margin-bottom:24px">

    <div class="appe-card">

      <div class="appe-row"><label>Tasks list</label><select id="cd-taskpath" style="flex:1;max-width:360px"></select></div>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center"><button class="btn btn-primary" id="cd-savepaths">Save selection</button><span id="cd-status2" style="font-size:12px;color:var(--text3)"></span></div>
    </div>
    <div style="margin-top:26px;border-top:1px solid var(--border);padding-top:18px">
      <h3 style="margin:0 0 4px;font-size:13px">Google Calendar <span style="font-weight:400;color:var(--text3)">(your own OAuth app)</span></h3>
      <p style="color:var(--text3);font-size:12px;margin:0 0 12px;line-height:1.5">Create your <b>own</b> Google OAuth app, then paste the credentials here — ask the agent, it has a step-by-step guide. Register the <b>Redirect URI</b> below in your Google app. When connected, the Calendar app uses your Google Calendar (events only — for Google tasks use Todoist).</p>
      <div class="appe-card">
        <div class="appe-row"><label>Redirect URI</label><input id="gg-redirect" readonly title="Register this exact URI in your Google OAuth client" style="flex:1;max-width:360px;color:var(--text3)"></div>

      <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
        <button class="btn" id="gg-save">Save credentials</button>

        <button class="btn" id="gg-disconnect" style="display:none;color:var(--red)">Disconnect</button>
        <span id="gg-status" style="font-size:12px;color:var(--text3)"></span>
      </div>
    </div>
    <div style="margin-top:26px;border-top:1px solid var(--border);padding-top:18px">
      <h3 style="margin:0 0 4px;font-size:13px">Tasks via Todoist <span style="font-weight:400;color:var(--text3)">(optional)</span></h3>
      <p style="color:var(--text3);font-size:12px;margin:0 0 12px;line-height:1.5">Connect Todoist with a personal API token (Todoist → Settings → Integrations → Developer). When connected, the Tasks app uses Todoist <b>instead of</b> CalDAV / Prism.</p>
      <div class="appe-card">
        <div class="appe-row"><label>API token</label><input id="td-token" type="password" placeholder="••••••••" autocomplete="new-password" style="flex:1;max-width:360px"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" id="td-connect">Connect</button>
        <button class="btn" id="td-disconnect" style="display:none;color:var(--red)">Disconnect</button>
        <span id="td-status" style="font-size:12px;color:var(--text3)"></span>
      </div>
    </div>`
  const page = document.createElement('div'); page.className = 'settings-page'; page.appendChild(wrap); container.appendChild(page)
  const $ = s => wrap.querySelector(s)

  // Active sources: let the user pick which connected provider backs each app.
  const SRC_LABEL = { auto: 'Auto', local: 'Local', caldav: 'CalDAV', google: 'Google', todoist: 'Todoist' }
  const fillSrc = (sel, opts, val) => {
    sel.innerHTML = ''
    for (const o of opts) sel.appendChild(new Option(SRC_LABEL[o], o))
    sel.value = opts.includes(val) ? val : 'auto'
  }
  async function loadSources() {
    let d
    try { d = await (await fetch('/api/pim/sources')).json() } catch { return }
    const calOpts = ['auto', 'local'].concat(d.available.caldav ? ['caldav'] : [], d.available.google ? ['google'] : [])
    const taskOpts = ['auto', 'local'].concat(d.available.caldav ? ['caldav'] : [], d.available.todoist ? ['todoist'] : [])
    fillSrc($('#src-cal'), calOpts, d.calendar)
    fillSrc($('#src-task'), taskOpts, d.tasks)
    $('#src-cal-hint').textContent = d.calendar === 'auto' ? `→ ${SRC_LABEL[d.resolved.calendar] || d.resolved.calendar}` : ''
    $('#src-task-hint').textContent = d.tasks === 'auto' ? `→ ${SRC_LABEL[d.resolved.tasks] || d.resolved.tasks}` : ''
  }
  const saveSources = async () => {
    try { await fetch('/api/pim/sources', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ calendar: $('#src-cal').value, tasks: $('#src-task').value }) }) } catch {}
    loadSources()
  }
  $('#src-cal').addEventListener('change', saveSources)
  $('#src-task').addEventListener('change', saveSources)
  await loadSources()

  const status = $('#cd-status'), known = { eventPath: '', taskPath: '' }
  const fillCals = (cals) => {
    const ev = $('#cd-evpath'), tk = $('#cd-taskpath')
    ev.innerHTML = ''; tk.innerHTML = ''
    for (const c of (cals || [])) {
      const label = (c.name || c.path) + (c.components && c.components.length ? ` · ${c.components.join(', ')}` : '')
      ev.appendChild(new Option(label, c.path)); tk.appendChild(new Option(label, c.path))
    }
    if (known.eventPath) ev.value = known.eventPath
    if (known.taskPath) tk.value = known.taskPath
    $('#cd-cals').style.display = (cals && cals.length) ? '' : 'none'
  }
  try {
    const d = await (await fetch('/api/caldav/config')).json()
    known.eventPath = d.eventPath || ''; known.taskPath = d.taskPath || ''
    $('#cd-url').value = d.url || ''; $('#cd-user').value = d.user || ''
    if (d.configured) { $('#cd-disconnect').style.display = ''; status.style.color = 'var(--green)'; status.textContent = 'Connected' }
  } catch {}
  const post = async (payload) => {
    const r = await fetch('/api/caldav/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
    if (!r.ok) throw new Error((await r.text()).trim() || 'Failed')
    return r.json()
  }
  $('#cd-connect').addEventListener('click', async () => {
    status.style.color = 'var(--text3)'; status.textContent = 'Connecting…'
    try {
      const d = await post({ url: $('#cd-url').value.trim(), user: $('#cd-user').value.trim(), password: $('#cd-pass').value })
      status.style.color = 'var(--green)'; status.textContent = 'Connected ✓'
      $('#cd-disconnect').style.display = ''
      fillCals(d.calendars); loadSources()
    } catch (e) { status.style.color = 'var(--red)'; status.textContent = e.message }
  })
  $('#cd-savepaths').addEventListener('click', async () => {
    const st = $('#cd-status2'); st.style.color = 'var(--text3)'; st.textContent = 'Saving…'
    try {
      await post({ url: $('#cd-url').value.trim(), user: $('#cd-user').value.trim(), eventPath: $('#cd-evpath').value, taskPath: $('#cd-taskpath').value })
      known.eventPath = $('#cd-evpath').value; known.taskPath = $('#cd-taskpath').value
      st.style.color = 'var(--green)'; st.textContent = 'Saved ✓'
    } catch (e) { st.style.color = 'var(--red)'; st.textContent = e.message }
  })
  $('#cd-disconnect').addEventListener('click', async () => {
    if (!confirm('Disconnect CalDAV? Calendar and Tasks will fall back to the Prism database.')) return
    try {
      await post({ disconnect: true })
      $('#cd-disconnect').style.display = 'none'; $('#cd-cals').style.display = 'none'; $('#cd-pass').value = ''
      status.style.color = 'var(--text3)'; status.textContent = 'Disconnected'; loadSources()
    } catch (e) { status.style.color = 'var(--red)'; status.textContent = e.message }
  })

  // Google Calendar (bring-your-own OAuth app)
  const ggStatus = $('#gg-status')
  async function ggLoad() {
    try {
      const d = await (await fetch('/api/oauth/google/config')).json()
      $('#gg-redirect').value = d.redirectUri || (location.origin + '/api/oauth/google/callback')
      $('#gg-id').value = d.clientId || ''
      if (d.connected) { $('#gg-disconnect').style.display = ''; ggStatus.style.color = 'var(--green)'; ggStatus.textContent = 'Connected' }
      else { $('#gg-disconnect').style.display = 'none'; ggStatus.textContent = '' }
    } catch {}
  }
  const ggSaveCreds = async () => {
    const r = await fetch('/api/oauth/google/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ clientId: $('#gg-id').value.trim(), clientSecret: $('#gg-secret').value }) })
    if (!r.ok) throw new Error((await r.text()).trim() || 'Failed')
  }
  await ggLoad()
  $('#gg-save').addEventListener('click', async () => {
    ggStatus.style.color = 'var(--text3)'; ggStatus.textContent = 'Saving…'
    try { await ggSaveCreds(); ggStatus.style.color = 'var(--green)'; ggStatus.textContent = 'Saved ✓' }
    catch (e) { ggStatus.style.color = 'var(--red)'; ggStatus.textContent = e.message }
  })
  $('#gg-auth').addEventListener('click', async () => {
    ggStatus.style.color = 'var(--text3)'; ggStatus.textContent = 'Saving…'
    try { if ($('#gg-id').value.trim() && $('#gg-secret').value.trim()) await ggSaveCreds() }
    catch (e) { ggStatus.style.color = 'var(--red)'; ggStatus.textContent = e.message; return }
    ggStatus.textContent = 'Waiting for Google…'
    const popup = window.open('/api/oauth/google/start', 'prism-oauth', 'width=520,height=680')
    // Poll the server for connection — Google's COOP can sever window.opener, so
    // the popup's postMessage may never arrive.
    let tries = 0
    const iv = setInterval(async () => {
      tries++
      let connected = false
      try { connected = (await (await fetch('/api/oauth/google/config')).json()).connected } catch {}
      if (connected) {
        clearInterval(iv); ggLoad(); loadSources()
        ggStatus.style.color = 'var(--green)'; ggStatus.textContent = 'Connected ✓'
      } else if ((popup && popup.closed) || tries > 60) {
        clearInterval(iv)
        if (ggStatus.textContent === 'Waiting for Google…') { ggStatus.style.color = 'var(--text3)'; ggStatus.textContent = '' }
      }
    }, 2000)
  })
  window.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'oauth-done') return
    setTimeout(ggLoad, 300)
    if (e.data.ok) { ggStatus.style.color = 'var(--green)'; ggStatus.textContent = 'Connected ✓' }
    else { ggStatus.style.color = 'var(--red)'; ggStatus.textContent = 'Authorization failed' }
  })
  $('#gg-disconnect').addEventListener('click', async () => {
    try {
      await fetch('/api/oauth/google/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ disconnect: true }) })
      ggLoad(); loadSources(); ggStatus.style.color = 'var(--text3)'; ggStatus.textContent = 'Disconnected'
    } catch (e) { ggStatus.style.color = 'var(--red)'; ggStatus.textContent = e.message }
  })

  // Todoist task backend
  try {
    const d = await (await fetch('/api/todoist/config')).json()
    if (d.configured) { $('#td-disconnect').style.display = ''; const s2 = $('#td-status'); s2.style.color = 'var(--green)'; s2.textContent = 'Connected' }
  } catch {}
  $('#td-connect').addEventListener('click', async () => {
    const st = $('#td-status'); st.style.color = 'var(--text3)'; st.textContent = 'Connecting…'
    try {
      const r = await fetch('/api/todoist/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: $('#td-token').value.trim() }) })
      if (!r.ok) throw new Error((await r.text()).trim() || 'Failed')
      st.style.color = 'var(--green)'; st.textContent = 'Connected ✓'; $('#td-disconnect').style.display = ''; loadSources()
    } catch (e) { st.style.color = 'var(--red)'; st.textContent = e.message }
  })
  $('#td-disconnect').addEventListener('click', async () => {
    const st = $('#td-status')
    try {
      await fetch('/api/todoist/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ disconnect: true }) })
      $('#td-disconnect').style.display = 'none'; $('#td-token').value = ''
      st.style.color = 'var(--text3)'; st.textContent = 'Disconnected'; loadSources()
    } catch (e) { st.style.color = 'var(--red)'; st.textContent = e.message }
  })
}

async function renderRAGTab(container) {
  // Check RAG status first
  try {
    const res = await fetch('/api/rag/status')
    const data = await res.json()
    if (!data.ready) {
      const msg = document.createElement('div')
      msg.style.cssText = 'padding:40px 24px;color:var(--text3);font-size:13px'
      msg.textContent = 'RAG not ready: ' + (data.status || 'initializing…')
      container.appendChild(msg)
      setTimeout(() => { if (currentTab === 'knowledge') renderTab('knowledge') }, 2000)
      return
    }
  } catch { /* ignore, render anyway */ }

  const tab = document.createElement('div')
  tab.id = 'rag-tab'
  container.appendChild(tab)

  // Sidebar
  const sidebar = document.createElement('aside')
  sidebar.id = 'rag-sidebar'
  sidebar.innerHTML = `
    <div id="rag-sidebar-header">
      <span id="rag-sidebar-title">Collections</span>
      <button id="new-collection-btn" title="New collection" onclick="openModal()">+</button>
    </div>
    <div id="collections-list"></div>`
  tab.appendChild(sidebar)

  // Content
  const content = document.createElement('div')
  content.id = 'rag-content'
  content.innerHTML = `<div id="no-collection-msg"><div class="icon">${icon('knowledge',40)}</div><div>Select a collection or create a new one</div></div>`
  tab.appendChild(content)

  await loadCollections()
}

async function loadCollections() {
  try {
    const res = await fetch(`/api/rag/collections?session=${encodeURIComponent(SESSION)}`)
    collections = await res.json()
    if (!Array.isArray(collections)) collections = []
    renderCollections()
  } catch(e) { showToast('Connection error: ' + e.message, true) }
}

function renderCollections() {
  const el = document.getElementById('collections-list')
  if (!el) return
  if (collections.length === 0) {
    el.innerHTML = '<div style="padding:20px 16px;font-size:12px;color:var(--text3);text-align:center">No collections</div>'
    return
  }
  el.innerHTML = ''
  for (const c of collections) {
    const item = document.createElement('div')
    item.className = 'collection-item' + (c.name === currentCollection ? ' active' : '')
    item.innerHTML = `
      <span class="collection-name">${escHtml(c.name)}</span>
      <span class="collection-count">${c.doc_count} doc${c.doc_count !== 1 ? 's' : ''}</span>
      <button class="collection-del" title="Delete">✕</button>`
    item.addEventListener('click', () => selectCollection(c.name))
    item.querySelector('.collection-del').addEventListener('click', e => {
      e.stopPropagation(); deleteCollection(c.name)
    })
    el.appendChild(item)
  }
}

function selectCollection(name) {
  currentCollection = name
  renderCollections()
  renderRAGContent()
  loadDocuments()
}

async function deleteCollection(name) {
  if (!confirm(`Delete collection "${name}" and all its documents?`)) return
  await fetch(`/api/rag/collections?session=${encodeURIComponent(SESSION)}&name=${encodeURIComponent(name)}`, { method: 'DELETE' })
  if (currentCollection === name) {
    currentCollection = null
    const content = document.getElementById('rag-content')
    if (content) content.innerHTML = `<div id="no-collection-msg"><div class="icon">${icon('knowledge',40)}</div><div>Select a collection or create a new one</div></div>`
  }
  await loadCollections()
}

function renderRAGContent() {
  const col = collections.find(c => c.name === currentCollection)
  const desc = col ? (col.description || '') : ''
  const content = document.getElementById('rag-content')
  if (!content) return
  content.innerHTML = `
    <div id="rag-content-header">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;min-width:0">
        <span style="font-size:14px;font-weight:600;color:var(--text)">${icon('files',15)} ${escHtml(currentCollection)}</span>
        <input id="desc-input" type="text" value="${escHtml(desc)}"
               placeholder="Description for the agent (e.g. internal API docs…)"
               style="background:transparent;border:none;border-bottom:1px dashed var(--border2);
                      color:var(--text3);font-size:11.5px;font-family:var(--sans);
                      outline:none;padding:2px 0;width:100%">
      </div>
    </div>
    <div id="upload-zone">
      <div id="upload-icon">${icon('upload',26)}</div>
      <div id="upload-label">Drop a file here or click to select</div>
      <div id="upload-hint">PDF, DOCX, TXT, CSV, MD, JSON — max 50 MB</div>
      <input id="upload-input" type="file" multiple accept=".pdf,.docx,.txt,.csv,.md,.json,.tsv"
             onchange="uploadFiles(this.files)">
    </div>
    <div id="upload-progress"></div>
    <div id="docs-area"><div style="padding:20px;color:var(--text3);font-size:13px">Loading…</div></div>`

  document.getElementById('upload-zone').addEventListener('click', () => document.getElementById('upload-input').click())
  const zone = document.getElementById('upload-zone')
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over') })
  zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'))
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); uploadFiles(e.dataTransfer.files) })
  const di = document.getElementById('desc-input')
  di.addEventListener('blur', () => saveDescription(di.value.trim()))
  di.addEventListener('keydown', e => { if (e.key === 'Enter') di.blur() })
}

async function saveDescription(value) {
  const col = collections.find(c => c.name === currentCollection)
  if (!col) return
  col.description = value
  await fetch(`/api/rag/collections?session=${encodeURIComponent(SESSION)}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: currentCollection, description: value })
  })
}

async function loadDocuments() {
  if (!currentCollection) return
  try {
    const res = await fetch(`/api/rag/documents?collection=${encodeURIComponent(currentCollection)}`)
    const docs = await res.json()
    renderDocuments(Array.isArray(docs) ? docs : [])
  } catch { showToast('Failed to load documents', true) }
}

function renderDocuments(docs) {
  const area = document.getElementById('docs-area')
  if (!area) return
  if (docs.length === 0) {
    area.innerHTML = '<div style="padding:24px 0;text-align:center;font-size:13px;color:var(--text3)">No documents in this collection.<br>Drop a file in the zone above.</div>'
    return
  }
  area.innerHTML = `
    <table id="docs-table">
      <thead><tr><th>File</th><th>Size</th><th>Chunks</th><th>Updated</th><th></th></tr></thead>
      <tbody>${docs.map(d => `
        <tr>
          <td>${escHtml(d.filename)}</td>
          <td>${fmtSize(d.size_bytes)}</td>
          <td>${d.chunk_count}</td>
          <td>${fmtDate(d.updated_at)}</td>
          <td><button class="doc-del-btn" title="Delete" data-id="${d.id}">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>`
  area.querySelectorAll('.doc-del-btn').forEach(btn => {
    btn.addEventListener('click', () => deleteDocument(Number(btn.dataset.id)))
  })
}

async function deleteDocument(id) {
  await fetch(`/api/rag/document?id=${id}`, { method: 'DELETE' })
  loadDocuments(); loadCollections()
}

async function uploadFiles(files) {
  if (!files || files.length === 0) return
  if (!currentCollection) { showToast('Select a collection first', true); return }
  const zone = document.getElementById('upload-zone')
  const progress = document.getElementById('upload-progress')
  zone.classList.add('uploading'); progress.classList.add('visible')
  for (let i = 0; i < files.length; i++) {
    const file = files[i]
    progress.textContent = `Uploading ${i+1}/${files.length}: ${file.name}…`
    try {
      const form = new FormData()
      form.append('file', file); form.append('collection', currentCollection); form.append('session', SESSION)
      const res = await fetch('/api/rag/upload', { method: 'POST', body: form })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || res.statusText)
      showToast(`✓ ${file.name} — ${data.chunks} chunks indexed`)
    } catch(e) { showToast(`Error ${file.name}: ${e.message}`, true) }
  }
  zone.classList.remove('uploading'); progress.classList.remove('visible'); progress.textContent = ''
  document.getElementById('upload-input').value = ''
  await loadDocuments(); await loadCollections()
}

// ── Modal ─────────────────────────────────────────────────────────────────────

function openModal() {
  document.getElementById('modal-overlay').classList.add('visible')
  setTimeout(() => document.getElementById('modal-input').focus(), 50)
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return
  document.getElementById('modal-overlay').classList.remove('visible')
  document.getElementById('modal-input').value = ''
}
async function createCollection() {
  const input = document.getElementById('modal-input')
  const name = input.value.trim().toLowerCase().replace(/[^a-z0-9\-_]/g,'-').replace(/-+/g,'-')
  if (!name) { input.focus(); return }
  document.getElementById('modal-overlay').classList.remove('visible')
  input.value = ''
  // Persist an empty collection so it survives with zero documents.
  try {
    await fetch(`/api/rag/collections?session=${encodeURIComponent(SESSION)}`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: '' }),
    })
  } catch (_) {}
  if (!collections.find(c => c.name === name)) {
    collections.push({ name, doc_count: 0, chunk_count: 0 })
    renderCollections()
  }
  selectCollection(name)
}

// ── Utils ─────────────────────────────────────────────────────────────────────

function fmtSize(b) {
  if (b < 1024) return b + ' B'
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB'
  return (b/1048576).toFixed(1) + ' MB'
}
function fmtDate(iso) {
  if (!iso) return ''
  return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'2-digit', year:'numeric' })
}

let toastTimer = null
function showToast(msg, isError = false) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.className = 'visible' + (isError ? ' error' : '')
  if (toastTimer) clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { t.className = '' }, 3500)
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal-overlay').classList.remove('visible')
})

fetch('/api/auth').then(r => r.json()).then(d => {
  if (!d.authenticated) { window.top.location.href = '/'; return }
  if (d.auth_enabled) document.getElementById('logout-btn').style.display = 'block'
})

async function logout() {
  await fetch('/api/auth', { method: 'DELETE' })
  window.top.location.href = '/'
}

// When embedded in the dashboard shell, the "back" link returns to the board via
// the parent instead of navigating this iframe to the dashboard.
if (window.parent !== window) {
  const bl = document.getElementById('back-link')
  if (bl) bl.addEventListener('click', e => { e.preventDefault(); window.parent.postMessage({ type: 'close-settings' }, '*') })
}
</script>
</body>
</html>
